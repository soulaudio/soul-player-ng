crash.body:
  en: 'The last session ended without closing normally. Open a pre-filled bug report? Your recent log is included, you can review it before sending.'
  de: 'Die letzte Sitzung wurde nicht normal beendet. Einen vorausgefüllten Fehlerbericht öffnen? Ihr aktuelles Protokoll ist enthalten – Sie können es vor dem Senden prüfen.'
  es: 'La última sesión terminó sin cerrarse con normalidad. ¿Abrir un informe de error rellenado? Se incluye tu registro reciente; puedes revisarlo antes de enviarlo.'
  zh: '上次会话未正常关闭。是否打开预填写的错误报告？已附上最近的日志，发送前可供查看。'
  cs: 'Minulá relace se neukončila normálně. Otevřít předvyplněné hlášení chyby? Je přiložen váš nedávný protokol – před odesláním si jej můžete zkontrolovat.'
  ja: '前回のセッションは正常に終了しませんでした。入力済みのバグ報告を開きますか？最近のログが含まれています（送信前に確認できます）。'
