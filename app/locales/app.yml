settings.autoCheck:
  en: 'Check for updates automatically'
  de: 'Automatisch nach Updates suchen'
  es: 'Buscar actualizaciones automáticamente'
  zh: '自动检查更新'
  cs: 'Automaticky hledat aktualizace'
  ja: 'アップデートを自動的に確認'
settings.autoCheckDesc:
  en: 'At launch, and twice a day while Soul Player is open.'
  de: 'Beim Start und zweimal täglich, solange Soul Player geöffnet ist.'
  es: 'Al iniciar y dos veces al día mientras Soul Player esté abierto.'
  zh: '启动时检查，Soul Player 打开期间每天检查两次。'
  cs: 'Při spuštění a dvakrát denně, dokud je Soul Player otevřený.'
  ja: '起動時と、Soul Player が開いている間は 1 日 2 回。'
settings.autoInstall:
  en: 'Install updates automatically'
  de: 'Updates automatisch installieren'
  es: 'Instalar actualizaciones automáticamente'
  zh: '自动安装更新'
  cs: 'Automaticky instalovat aktualizace'
  ja: 'アップデートを自動的にインストール'
settings.autoInstallDesc:
  en: 'Download new versions in the background and install them the next time you quit Soul Player.'
  de: 'Neue Versionen im Hintergrund herunterladen und beim nächsten Beenden von Soul Player installieren.'
  es: 'Descarga las nuevas versiones en segundo plano y las instala la próxima vez que salgas de Soul Player.'
  zh: '在后台下载新版本，并在下次退出 Soul Player 时安装。'
  cs: 'Stahovat nové verze na pozadí a nainstalovat je při příštím ukončení Soul Playeru.'
  ja: '新しいバージョンをバックグラウンドでダウンロードし、次に Soul Player を終了したときにインストールします。'
settings.updatesViaPackageManager:
  en: 'Updates are handled by your package manager.'
  de: 'Updates werden von deiner Paketverwaltung verwaltet.'
  es: 'Las actualizaciones las gestiona tu gestor de paquetes.'
  zh: '更新由你的软件包管理器处理。'
  cs: 'Aktualizace spravuje tvůj správce balíčků.'
  ja: 'アップデートはパッケージマネージャーが管理します。'
playback.cantPlayUnsupported:
  en: 'Can''t play this track: its format isn''t supported in this build.'
  de: 'Dieser Titel kann nicht abgespielt werden: Das Format wird in dieser Version nicht unterstützt.'
  es: 'No se puede reproducir esta pista: su formato no es compatible con esta versión.'
  zh: '无法播放此曲目：此版本不支持该格式。'
  cs: 'Tuto skladbu nelze přehrát: její formát není v této verzi podporován.'
  ja: 'このトラックを再生できません：この形式はこのビルドではサポートされていません。'
playback.cantPlay:
  en: 'Can''t play this track.'
  de: 'Dieser Titel kann nicht abgespielt werden.'
  es: 'No se puede reproducir esta pista.'
  zh: '无法播放此曲目。'
  cs: 'Tuto skladbu nelze přehrát.'
  ja: 'このトラックを再生できません。'
playback.dismiss:
  en: 'Dismiss'
  de: 'Schließen'
  es: 'Descartar'
  zh: '关闭'
  cs: 'Zavřít'
  ja: '閉じる'
settings.sourceLimit:
  en: 'Maximum %{max} sources. Remove one to add another.'
  de: 'Maximal %{max} Quellen. Entferne eine, um eine andere hinzuzufügen.'
  es: 'Máximo %{max} fuentes. Elimina una para añadir otra.'
  zh: '最多 %{max} 个来源。请先移除一个再添加。'
  cs: 'Maximálně %{max} zdrojů. Odeber jeden, abys mohl přidat další.'
  ja: 'ソースは最大 %{max} 件です。追加するには 1 件削除してください。'
