  zh: '移到“应用程序”？'
  cs: 'Přesunout do Aplikací?'
  ja: '「アプリケーション」に移動しますか？'
move.body:
  en: 'Soul Player isn''t in your Applications folder. Move it there so it''s easy to find and keeps itself up to date.'
  de: 'Soul Player befindet sich nicht im Ordner „Programme“. Verschiebe es dorthin, damit du es leicht findest und es sich selbst aktuell hält.'
  es: 'Soul Player no está en la carpeta Aplicaciones. Muévelo allí para encontrarlo fácilmente y que se mantenga actualizado.'
  zh: 'Soul Player 不在“应用程序”文件夹中。将其移到那里，便于查找并能自动保持更新。'
  cs: 'Soul Player není ve složce Aplikace. Přesuň ho tam, ať ho snadno najdeš a sám se aktualizuje.'
  ja: 'Soul Player は「アプリケーション」フォルダーにありません。移動すると見つけやすくなり、自動で最新の状態に保たれます。'
move.bodyDiskImage:
  en: 'Soul Player is running from its disk image, so it can''t update itself. Move it to Applications? It reopens from there and the disk image is ejected.'
  de: 'Soul Player läuft direkt aus dem Disk-Image und kann sich so nicht aktualisieren. In „Programme“ verschieben? Es startet von dort neu und das Image wird ausgeworfen.'
  es: 'Soul Player se está ejecutando desde su imagen de disco, así que no puede actualizarse. ¿Moverlo a Aplicaciones? Se volverá a abrir desde allí y la imagen se expulsará.'
  zh: 'Soul Player 正从磁盘映像运行，因此无法自动更新。要移到“应用程序”吗？它会从那里重新打开，并推出磁盘映像。'
  cs: 'Soul Player běží přímo z obrazu disku, takže se nemůže aktualizovat. Přesunout do Aplikací? Znovu se odtud otevře a obraz disku se vysune.'
  ja: 'Soul Player はディスクイメージから実行されているため、自動アップデートできません。「アプリケーション」に移動しますか？そこから再び開き、ディスクイメージは取り出されます。'
