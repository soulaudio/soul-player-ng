rosetta.title:
  en: 'Switch to the Apple silicon version?'
  de: 'Zur Apple-Silicon-Version wechseln?'
  es: '¿Cambiar a la versión para Apple silicon?'
  zh: '切换到 Apple 芯片版本？'
  cs: 'Přejít na verzi pro Apple silicon?'
  ja: 'Appleシリコン版に切り替えますか？'
rosetta.body:
  en: 'This is the Intel version of Soul Player, so your Mac runs it through Rosetta translation. The version made for Apple silicon starts faster and uses less battery, and future versions of macOS will stop running Intel apps. Switching downloads it and restarts Soul Player.'
  de: 'Dies ist die Intel-Version von Soul Player, daher führt dein Mac sie über die Rosetta-Übersetzung aus. Die Version für Apple Silicon startet schneller und schont den Akku, und künftige macOS-Versionen werden keine Intel-Apps mehr ausführen. Beim Wechseln wird sie heruntergeladen und Soul Player neu gestartet.'
  es: 'Esta es la versión para Intel de Soul Player, así que tu Mac la ejecuta mediante la traducción de Rosetta. La versión para Apple silicon se abre más rápido y gasta menos batería, y las futuras versiones de macOS dejarán de ejecutar apps para Intel. Al cambiar, se descarga y Soul Player se reinicia.'
  zh: '这是 Soul Player 的 Intel 版本，你的 Mac 需通过 Rosetta 转译来运行它。为 Apple 芯片打造的版本启动更快、更省电，而且未来的 macOS 将不再运行 Intel 应用。切换后会下载该版本并重新启动 Soul Player。'
  cs: 'Toto je verze Soul Playeru pro Intel, takže ji tvůj Mac spouští přes překlad Rosetta. Verze pro Apple silicon startuje rychleji a šetří baterii a budoucí verze macOS přestanou aplikace pro Intel spouštět. Přechodem se stáhne a Soul Player se restartuje.'
  ja: 'これは Soul Player の Intel 版のため、Mac は Rosetta による変換で実行しています。Appleシリコン版は起動が速く、バッテリーの消費も少なくなります。また今後の macOS では Intel アプリが動作しなくなります。切り替えるとダウンロードされ、Soul Player が再起動します。'
