[workspace]
members = ["."]
resolver = "3"

[package]
name = "soul-player"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Soul Audio desktop player shell (Tauri 2) over soul-audio-service."

[lib]
name = "soul_player"
path = "src/lib.rs"

[[bin]]
name = "soul-player"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Exposes the test-only `load_folder_path` command (bypasses the native folder
# dialog for WebDriver/e2e). Off in release.
e2e = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# The audio engine + cpal sink come from the library repo (git); the headless
# backend service lives in this repo (path).
soul-audio-core = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main" }
soul-audio-service = { path = "../../crates/soul-audio-service", features = ["specta"] }
soul-audio-desktop = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main", features = ["playback"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["typescript"] }
specta-typescript = "0.0.12"
specta = "=2.0.0-rc.25"
tauri-plugin-dialog = "2"
# Auto-update: the updater fetches + verifies (minisign) the signed bundle from
# the GitHub release `latest.json`; `process` provides the relaunch after apply.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
# The mock runtime for Rust product-e2e (Tier 1). Dev-only: `cargo build
# --release` never compiles dev-deps, so the `test` feature can't leak into a
# shipped binary.
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[profile.release]
# Shrink the packaged binary; keeps dev builds untouched.
strip = true

# DSD playback needs real-time decode. Unoptimized, the DSD decimator's 128-tap
# FIR at 2.82 MHz runs ~0.18x real-time, so `npm run tauri dev` (a debug build)
# underruns and DSD "doesn't play". Optimize the audio crates AND this app crate
# (the deck/decoder generics monomorphize here with the concrete CpalSink), which
# lifts debug decode to multiples of real-time. Tauri/webview stay at opt 0 so
# the dev build stays fast to compile. (Release already optimizes everything.)
[profile.dev]
opt-level = 2

[profile.dev.package.soul-audio-core]
opt-level = 2
[profile.dev.package.soul-audio-desktop]
opt-level = 2
[profile.dev.package.soul-audio-service]
opt-level = 2
[profile.dev.package.soul-audio-engine]
opt-level = 2
[profile.dev.package.soul-audio-control]
opt-level = 2
[profile.dev.package.soul-audio-queue]
opt-level = 2

# The app's `src/` files keep their own `#![forbid(unsafe_code)]`; we don't
# forbid at the workspace level because the test harness needs the (edition-2024
# `unsafe`) `std::env::set_var`. The headless service forbids unsafe outright —
# that's the layer that must stay firmware-trustworthy (see docs/ARCHITECTURE.md).
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
