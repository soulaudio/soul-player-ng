[package]
name = "soul-macos-native"
version = "0.1.0"
edition = "2024"
publish = false
description = "The few AppKit hooks Rune doesn't expose (Finder 'open documents'). The only crate in the app allowed `unsafe`, each block justified."

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventManager", "NSAppleEventDescriptor", "NSNotification", "NSString", "NSURL", "NSOperation", "block2"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication"] }
