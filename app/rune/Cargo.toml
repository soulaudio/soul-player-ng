[package]
name = "soul-player-rune"
version = "0.4.3"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Rune (native GPU) UI head for Soul Player, over soul-player-host."

[[bin]]
# The USER-VISIBLE name, and deliberately not the crate's. This name becomes
# `/usr/bin/<name>`, the installed desktop entry's basename, the MPRIS bus name
# (via `desktop_id()`'s fallback) and the .deb/AppImage/NSIS FILENAMES —
# cargo-packager builds those from the main binary's name
# (`package/deb/mod.rs`: `format!("{}_{}_{}", config.main_binary_name()?, ..)`).
#
# It does NOT set the .deb's `Package:` field: that is the kebab-cased
# `product-name` below, and has read `soul-player` all along. Worth stating
# because assuming otherwise produced a whole unnecessary package-transition
# apparatus here before the published 0.4.2 .deb disproved it.
#
# "rune" is the internal name of this UI head, which means nothing to anyone
# installing a music player, so it stays on the crate (`[package] name` above,
# where only developers see it) and never reaches a package.
name = "soul-player"
path = "src/main.rs"

[workspace]
resolver = "3"

[lints.rust]
unsafe_code = "forbid"

# Rune's dependency tree is enormous (wgpu + winit + parley + icu + resvg …);
# with full dev debuginfo the MSVC linker overflows the program-database limit
# (LNK1140). Drop debuginfo in dev — a GPU UI spike doesn't need line-level
# debug symbols, and this keeps `cargo build` working on Windows/MSVC. Release
# (for the bake-off binary-size measure) is unaffected.
[profile.dev]
debug = 0

# Playback decodes through soul-audio-core's cascaded 128-tap FIR DSD decimators
# and the resampler — far too slow unoptimized to sustain the audio clock, so DSD
# starves the sink and plays at the WRONG SPEED in a debug build. Optimize the
# audio pipeline crates at -O3 even in dev so playback is real-time, while the UI
# code stays debuggable. (soul-audio-core guards this with its own
# `dsd_decodes_faster_than_real_time` test.)
[profile.dev.package.soul-audio-core]
opt-level = 3
[profile.dev.package.soul-audio-desktop]
opt-level = 3
[profile.dev.package.soul-audio-engine]
opt-level = 3
# cpal drives the WASAPI/CoreAudio/ALSA device enumeration + open. Unoptimized, its
# format-probing loops make enumerating + opening a device take seconds in a debug build
# (worst on a Bluetooth-heavy Windows setup), which stalls the output-device switch and the
# first-paint device list. Release already optimizes it; match that in dev so the device open
# is realistic while testing. OS-call latency (WASAPI endpoint activation) is unaffected.
[profile.dev.package.cpal]
opt-level = 3

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "07c369b13e8bd82c3f0a74164bd132965de88830", features = ["native-file-dialog"] }
# Rune's parley stack pulls parley_engine WITHOUT its `complex-scripts` feature,
# so CJK (Chinese/Japanese) text hits `new_for_non_complex_scripts` and logs
# "No segmentation model for complex script". We don't use parley_engine
# directly — this dep exists only to union that feature on across the graph, so
# the dictionary segmenter (and the CJK data already baked via icu_segmenter's
# compiled_data) is used. Must track Rune's parley version (0.12).
parley_engine = { version = "0.12", features = ["complex-scripts"] }
soul-player-host = { path = "../../crates/soul-player-host" }
anyhow = "1"
# Per-user config dir, to persist settings across launches.
dirs = "6"
# Settings persistence (best practice): one structured TOML file in the OS config
# dir, (de)serialised via serde — replaces the earlier scattered plain-text files.
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# Portable JSON for exported/imported audio profiles (the format the future DAP reads).
serde_json = "1"
# Compact binary (de)serialisation for the per-source scan cache (warm startup).
# TOML can't carry the cache's path-keyed map + u128 stamps; postcard is a lean,
# pure-Rust, no-FFI format whose MIT/Apache-2.0 licence clears the policy gate.
postcard = { version = "1", features = ["use-std"] }
# Internationalisation: compile-time-embedded translations (locales/app.yml) with
# a global `t!()` macro; `sys-locale` detects the OS language for the default.
rust-i18n = "3"
sys-locale = "0.3"
# Auto-update: checks GitHub Releases for a newer signed build and installs it.
# The updater's own key (independent of OS code-signing) verifies each update.
cargo-packager-updater = "0.2"
semver = "1"
# Structured logging to a rolling per-OS log file. The non-blocking writer moves
# disk I/O off the calling thread so the audio/GPU hot paths never block on a log
# write; panics are routed into the same file via a hook.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
tracing-panic = "0.1"
# "Report a problem" / "Open logs folder": open the browser + file manager, and
# percent-encode the pre-filled GitHub issue URL.
open = "5"
urlencoding = "2"
# OS name/version for the bug-report diagnostics block.
os_info = "3"
# OS "Now Playing" / media-session integration (hardware media keys + lock-screen
# / SMTC / MPRIS transport). `use_zbus` gives a pure-Rust MPRIS backend on Linux
# (no libdbus system dep). The Windows SMTC backend needs the window's HWND, which
# we pull from Rune via `WindowHandle::with_raw_handle` using `raw-window-handle`.
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }
raw-window-handle = "0.6"
# Decode the bundled app icon (PNG) to RGBA for the system-tray icon, and decode
# user-picked cover images (jpeg/webp/gif in addition to png) for the Edit-Artwork
# crop step, which crops + re-encodes the result back to PNG (png keeps encode).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# Enumerate connected monitors (stateless `DisplayInfo::all()`, no event loop) to
# clamp a restored window on-screen when a display was unplugged / resized. Its
# Windows backend uses `windows 0.62` (our exact pin — no version split) and it's
# Apache-2.0. Rune owns the only winit EventLoop, so we can't use winit's own
# `available_monitors()`; this queries the OS display list independently.
display-info = "0.5"

# The Linux session E2E test (`tests/linux_session_e2e.rs`) spawns the REAL
# binary and inspects the MPRIS session it publishes, so it needs a D-Bus
# client of its own. `zbus` rather than shelling out to `playerctl`/`busctl`:
# those are not installed on a stock CI runner, and a missing binary would make
# the test silently pass. Version 5 matches what `souvlaki`'s `use_zbus`
# backend already compiles, so this adds no second D-Bus stack.
[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = "5"
tempfile = "3"
# Reading the compositor's window tree (`swaymsg -t get_tree`) in the session
# E2E. Already a normal dependency, so this costs no extra build.
serde_json = "1"

# Native toast notifications (update-available, now-playing-while-backgrounded).
# We call the WinRT API directly on the `windows` crate souvlaki already compiled
# for SMTC — no `notify-rust`/`rune-notify`, so no second `windows` version. The
# explicit top-level `windows = "0.62"` also PINS the resolver: gpu-allocator has
# a wide `>=0.53,<=0.62` range and cpal/sysinfo pull 0.54, so without this upper
# anchor the resolver can feed gpu-allocator 0.54 and break wgpu-hal (its
# `ID3D12Heap` must match wgpu-hal's). All WinRT + registry calls are safe (no
# `unsafe`). `windows-registry` (0.62-family split crates, not the big `windows`)
# writes the unpackaged-app AUMID under HKCU so Windows renders our toasts.
# Unix termination signals (kill / Ctrl-C / closed terminal) → the normal quit path
# (`signal_quit`), so they are not reported as crashes. Safe iterator API only.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

# macOS notifications (UNUserNotificationCenter) — Rune's own notifier crate, at the same
# pinned rev as `rune`, so its objc2 0.5 is the one Rune already compiles. It posts only
# from a bundled `.app` (`available()`); an unbundled dev binary stays silent.
[target.'cfg(target_os = "macos")'.dependencies]
rune-notify = { git = "https://github.com/anomalyco/rune", rev = "07c369b13e8bd82c3f0a74164bd132965de88830" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["UI_Notifications", "Data_Xml_Dom", "Foundation"] }
windows-registry = "0.6"

# cargo-packager (the "Tauri bundler without the webview") — produces an UNSIGNED
# installer today (SmartScreen nags); the signed updater + OS code-signing +
# release CI are the deferred half of Phase 3. Build:  cargo packager --release
# (from app/rune). name/version/authors come from [package] above.
[package.metadata.packager]
product-name = "Soul Player"
identifier = "co.soulaudio.soulplayer"
# What a USER is shown, so it must not be the `[package] description` — that one
# names the crate's role in this workspace ("Rune (native GPU) UI head for Soul
# Player, over soul-player-host"), which is the right text for developers and
# meaningless to anyone reading an application menu. cargo-packager only falls
# back to the crate's description when this is unset (`cli/config.rs`), and it
# becomes `Comment=` in the generated Linux desktop entry — the line GNOME shows
# under the app in search results and KDE shows as its tooltip.
description = "Play your music library — gapless, bit-perfect playback"
# Debian policy REQUIRES a Maintainer field, and cargo-packager fills it from
# `authors`. Without one `dpkg-deb` warns on every build and the package is
# technically malformed — caught by installing the built .deb rather than by
# reading the control file, which is why it is set here and not left to
# whoever next looks at the manifest.
authors = ["datadir s. r. o. <hello@datadir.co>"]
# The extended description, shown by `apt show` and the software centres. The
# one-line `description` above is the summary; without this the control file
# carries a literal "(none)" as the body.
long-description = """
Soul Player is a native desktop music player for local and remote libraries,
with a GPU-rendered interface and an all-Rust audio engine — no web view.

It plays every format the engine decodes (FLAC, ALAC, WavPack, AIFF, MPEG
Layers I-III, Vorbis, Opus and DSD) gaplessly, and can take the sound card
exclusively for bit-perfect output that bypasses the system mixer and its
resampling, switching to each track's native rate.
"""
# macOS: LSApplicationCategoryType (Finder / Launchpad / App Store "Music").
# On Linux it also fills the desktop entry's `Categories=`, which is what places
# the app under Sound & Video rather than nowhere at all: "Music" expands to the
# freedesktop `AudioVideo;Audio;Music;` (`AudioVideo` being the registered main
# category a multimedia app needs). Verified on the built AppImage.
category = "Music"
# macOS gets a proper `.icns` (the mark on a rounded tile, 16–1024 px; see icons/macos/).
icons = ["icons/icon.ico", "icons/128x128.png", "icons/macos/icon.icns"]
formats = ["nsis"]
# File associations ("Open With → Soul Player") wait for Rune's open-files hook
# (anomalyco/rune#157): receiving Finder's open-documents event needs AppKit code the app
# won't carry itself (`unsafe_code = "forbid"`). `open_files` already handles the files once
# they arrive; launch arguments work today. The removed setup is in git history (#265).

[package.metadata.packager.deb]
# Debian policy §12.5 requires every package to ship a copyright file at
# `/usr/share/doc/<package>/copyright`; `lintian` reports its absence as an
# error. DEP-5 machine-readable format, pointing at the system copy of
# Apache-2.0 as policy prefers.
files = { "../../packaging/deb/copyright" = "/usr/share/doc/soul-player/copyright", "../../packaging/deb/generated/changelog.gz" = "/usr/share/doc/soul-player/changelog.gz" }
# "sound" is the Debian section for audio players (policy §B.4 / the archive's
# own `sound` section, where every other music player lives).
section = "sound"
# Unlike the AppImage — which bundles its libraries — a .deb links against the
# system's, so every one it needs has to be declared or the package installs
# cleanly and then dies on launch.
#
# This list is DERIVED, not guessed: the binary's `NEEDED` entries plus every
# SONAME it dlopens, read back out of the built binary (`strings`/`objdump`)
# and cross-checked against the lockfile. That matters in both directions —
# the first draft of this list both missed libraries the app loads at runtime
# (fontconfig, gio) and demanded several it never touches. In particular it
# does NOT need:
#
#   * gtk3 / libayatana-appindicator — the tray is spoken directly over D-Bus
#     (`org.kde.StatusNotifierItem` + `com.canonical.dbusmenu`); there is no
#     gtk, gdk or appindicator crate anywhere in the dependency graph, so
#     pulling gtk3 in would be ~40 MB of transitive dependencies for nothing.
#   * libxdo — no xdo crate either.
#   * libGL / libEGL — wgpu's GL fallback is not compiled in (no `glow`, no
#     `khronos-egl` in the lockfile). Vulkan is the only backend.
#
# `a | b` alternatives are Debian's own syntax, for the t64 transition:
# Ubuntu 24.04+ and Debian 13 ship the `t64` names, Debian 12 and Ubuntu 22.04
# the untagged ones. Listing both keeps one package installable on both.
depends = [
    # The glibc floor, stated rather than implied. Without a version here apt
    # will happily install onto an older release and leave the user with a
    # binary that cannot load — the .rpm refuses in that situation, because
    # rpm derives versioned glibc requires from the ELF automatically, and the
    # two package types should behave the same.
    #
    # 2.35 is the highest NON-WEAK glibc version the binary references (the
    # 2.39 ones — pidfd_spawnp, pidfd_getpid — are weak and fall back).
    # `packaging/build-linux.sh` re-derives that from the built binary and
    # fails if it no longer matches, so this cannot quietly go stale.
    "libc6 (>= 2.35)",
    "libgcc-s1",
    # Audio: cpal's ALSA backend (the Linux sink, shared and exclusive).
    "libasound2t64 | libasound2",
    # D-Bus: MPRIS, the tray's StatusNotifierItem, the device-reservation
    # handshake for exclusive output, and the Secret Service keyring.
    "libdbus-1-3",
    # TLS for remote sources and the updater (reqwest -> native-tls -> openssl).
    "libssl3t64 | libssl3",
    # Font discovery. Dlopened, so it never shows up in `ldd` — and without it
    # text does not render, which is not a subtle failure.
    "libfontconfig1",
    # GIO, for the XDG desktop portal calls behind the native file dialog.
    "libglib2.0-0t64 | libglib2.0-0",
    # Windowing. libxcb is a hard NEEDED (libX11's transport); the rest winit
    # dlopens per backend — X11 and Wayland both, since which one is used is a
    # runtime decision a package cannot predict.
    "libxcb1",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "libwayland-client0",
    "libx11-6",
    "libx11-xcb1",
    "libxcursor1",
    "libxi6",
    # GPU: the Vulkan loader. The ICD itself is deliberately NOT a dependency —
    # a machine with an NVIDIA or AMD driver already has one, and depending on
    # `mesa-vulkan-drivers` would force Mesa onto systems that neither need nor
    # want it.
    "libvulkan1",
]
# NOTE: no `Provides`/`Conflicts`/`Replaces`, for two separate reasons.
#
# They are not NEEDED: `Package:` is the kebab-cased `product-name`, so it has
# been `soul-player` since before the binary rename (the published 0.4.2 .deb
# is named soul-player-rune_0.4.2_amd64.deb and carries `Package: soul-player`).
# The rename moves a file within one package, which dpkg handles by removing
# paths the new version no longer ships.
#
# They would also not WORK here: cargo-packager 0.11.8's `DebianConfig` accepts
# only depends/section/priority/files/package-name/desktop-template, and the
# provides/conflicts/replaces trio in its config module belongs to
# `PacmanConfig` — writing them here fails the build with "unknown field
# `conflicts`", which is now caught by
# `the_deb_packager_config_uses_only_fields_cargo_packager_accepts`.

# ── RPM (Fedora / openSUSE / RHEL) ──────────────────────────────────────────
# cargo-packager has no RPM backend (it does deb, AppImage and pacman), so the
# RPM is built by `cargo-generate-rpm` from the same staged files the .deb
# produced — see packaging/build-linux.sh and packaging/stage-linux.sh.
[package.metadata.generate-rpm]
name = "soul-player"
summary = "Play your music library — gapless, bit-perfect playback"
license = "Apache-2.0"
url = "https://github.com/soulaudio/soul-player-ng"
# `assets` paths are relative to app/rune. The binary is the stripped one the
# build script already produced; the desktop entry and icon come out of the
# .deb so the two packages cannot disagree about the app's identity.
assets = [
    { source = "target/release/soul-player", dest = "/usr/bin/soul-player", mode = "755" },
    { source = "target/release/linux-stage/soul-player.desktop", dest = "/usr/share/applications/soul-player.desktop", mode = "644" },
    { source = "target/release/linux-stage/soul-player.png", dest = "/usr/share/icons/hicolor/128x128/apps/soul-player.png", mode = "644" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/soul-player/LICENSE", mode = "644", doc = true },
]

# RPM's dependency names differ from Debian's for nearly every library, so this
# cannot reuse the `deb` list. Written against Fedora's names and verified the
# only way that means anything: `dnf install` the built .rpm in a Fedora
# container with nothing preinstalled, then launch the installed binary.
#
# rpm normally auto-generates `Requires` from the ELF's NEEDED entries, which
# would cover libc/libgcc/alsa/dbus/openssl/xcb — but NOT the libraries winit,
# wgpu and the tray `dlopen` at runtime. Those are the ones that turn into a
# package that installs fine and then dies, so they are listed explicitly.
[package.metadata.generate-rpm.requires]
# SONAMEs, not package names. rpm resolves `libX11.so.6()(64bit)` through
# whichever package *provides* that file, which differs per distro — Fedora
# calls it `libX11`, openSUSE `libX11-6`. Naming packages made the .rpm
# Fedora-only: `zypper install` refused it outright with "nothing provides
# 'libX11'". This form installs on both, and is the same mechanism rpm's own
# auto-generated requires use.
#
# Only the DLOPENED libraries are listed. rpm derives the rest from the ELF's
# NEEDED entries by itself; these are the ones it cannot see, and so the ones
# whose absence yields a package that installs cleanly and then fails at
# runtime.
"libfontconfig.so.1()(64bit)" = "*"
"libgio-2.0.so.0()(64bit)" = "*"
"libxkbcommon.so.0()(64bit)" = "*"
"libxkbcommon-x11.so.0()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"
"libX11.so.6()(64bit)" = "*"
"libX11-xcb.so.1()(64bit)" = "*"
"libXcursor.so.1()(64bit)" = "*"
"libXi.so.6()(64bit)" = "*"
"libvulkan.so.1()(64bit)" = "*"

[package.metadata.packager.macos]
# Ad-hoc signature ("-") until Developer ID signing + notarization (deferred). The linker
# signs only the executable; this seals the whole bundle (Info.plist and resources bound
# to the code, hardened runtime), so `codesign --verify --deep --strict` passes, the DMG
# and the updater's .app.tar.gz carry an intact signature, and a downloaded copy gets
# Gatekeeper's "Open Anyway" path. No identity, keychain or secret is involved.
signing-identity = "-"
