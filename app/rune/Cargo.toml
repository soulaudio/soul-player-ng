[package]
name = "soul-player-rune"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "Rune (native GPU) UI head for Soul Player, over soul-player-host."

[[bin]]
name = "soul-player-rune"
path = "src/main.rs"

[workspace]
resolver = "3"

[lints.rust]
unsafe_code = "forbid"

# Rune's dependency tree is enormous (wgpu + winit + parley + icu + resvg …);
# with full dev debuginfo the MSVC linker overflows the program-database limit
# (LNK1140). Drop debuginfo in dev — a GPU UI spike doesn't need line-level
# debug symbols, and this keeps `cargo build` working on Windows/MSVC. Release
# (for the bake-off binary-size measure) is unaffected.
[profile.dev]
debug = 0

# Playback decodes through soul-audio-core's cascaded 128-tap FIR DSD decimators
# and the resampler — far too slow unoptimized to sustain the audio clock, so DSD
# starves the sink and plays at the WRONG SPEED in a debug build. Optimize the
# audio pipeline crates at -O3 even in dev so playback is real-time, while the UI
# code stays debuggable. (soul-audio-core guards this with its own
# `dsd_decodes_faster_than_real_time` test.)
[profile.dev.package.soul-audio-core]
opt-level = 3
[profile.dev.package.soul-audio-desktop]
opt-level = 3
[profile.dev.package.soul-audio-engine]
opt-level = 3

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "07c369b13e8bd82c3f0a74164bd132965de88830", features = ["native-file-dialog"] }
# Rune's parley stack pulls parley_engine WITHOUT its `complex-scripts` feature,
# so CJK (Chinese/Japanese) text hits `new_for_non_complex_scripts` and logs
# "No segmentation model for complex script". We don't use parley_engine
# directly — this dep exists only to union that feature on across the graph, so
# the dictionary segmenter (and the CJK data already baked via icu_segmenter's
# compiled_data) is used. Must track Rune's parley version (0.12).
parley_engine = { version = "0.12", features = ["complex-scripts"] }
soul-player-host = { path = "../../crates/soul-player-host" }
anyhow = "1"
# Per-user config dir, to persist settings across launches.
dirs = "6"
# Settings persistence (best practice): one structured TOML file in the OS config
# dir, (de)serialised via serde — replaces the earlier scattered plain-text files.
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# Internationalisation: compile-time-embedded translations (locales/app.yml) with
# a global `t!()` macro; `sys-locale` detects the OS language for the default.
rust-i18n = "3"
sys-locale = "0.3"
# Auto-update: checks GitHub Releases for a newer signed build and installs it.
# The updater's own key (independent of OS code-signing) verifies each update.
cargo-packager-updater = "0.2"
semver = "1"

# cargo-packager (the "Tauri bundler without the webview") — produces an UNSIGNED
# installer today (SmartScreen nags); the signed updater + OS code-signing +
# release CI are the deferred half of Phase 3. Build:  cargo packager --release
# (from app/rune). name/version/description/authors come from [package] above.
[package.metadata.packager]
product-name = "Soul Player"
identifier = "co.datadir.soulplayer"
icons = ["icons/icon.ico", "icons/128x128.png"]
formats = ["nsis"]
