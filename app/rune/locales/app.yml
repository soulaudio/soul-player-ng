settings.signalPathDesc:
  en: 'The decode-to-output chain for the current track. Exclusive output and DSP are coming soon.'
  de: 'Die Dekodierungs- bis Ausgabekette des aktuellen Titels. Exklusivausgabe und DSP folgen bald.'
  es: 'La cadena de decodificacion a salida de la pista actual. Salida exclusiva y DSP llegaran pronto.'
  zh: '当前曲目的解码到输出链路。独占输出和 DSP 即将推出。'
  cs: 'Retezec od dekodovani po vystup pro aktualni skladbu. Exkluzivni vystup a DSP brzy.'
  ja: '現在のトラックのデコードから出力までの経路。排他出力とDSPは近日対応。'

