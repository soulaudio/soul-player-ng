  en: 'Where added music is organized. Files are arranged into folders by a naming template.'
  de: 'Wohin hinzugefügte Musik organisiert wird. Dateien werden per Namensvorlage in Ordner einsortiert.'
  es: 'Dónde se organiza la música añadida. Los archivos se ordenan en carpetas según una plantilla de nombres.'
