settings.loudnessOffDesc:
  en: 'No background scanning. Loudness and DR fill in only for tracks you play. Zero background CPU.'
  de: 'Kein Scannen im Hintergrund. Lautheit und DR werden nur für abgespielte Titel ermittelt. Keine Hintergrundlast.'
  es: 'Sin análisis en segundo plano. La sonoridad y el DR solo se calculan para las pistas que reproduces. Cero CPU en segundo plano.'
  zh: '不进行后台扫描。仅在播放时计算响度和 DR。无后台 CPU 占用。'
  cs: 'Žádné skenování na pozadí. Hlasitost a DR se doplní jen u přehrávaných skladeb. Nulová zátěž na pozadí.'
  ja: 'バックグラウンド解析なし。再生した曲だけラウドネスと DR を計算します。バックグラウンドの CPU 使用はゼロ。'
settings.loudnessThrottledDesc:
  en: 'Analyzes your library in the background, but pauses while you are listening so it never affects playback.'
  de: 'Analysiert deine Bibliothek im Hintergrund, pausiert aber während der Wiedergabe, sodass sie diese nie beeinträchtigt.'
  es: 'Analiza tu biblioteca en segundo plano, pero se pausa mientras escuchas para no afectar nunca la reproducción.'
  zh: '在后台分析音乐库，但在你聆听时暂停，因此绝不会影响播放。'
  cs: 'Analyzuje knihovnu na pozadí, ale během poslechu se pozastaví, takže nikdy neovlivní přehrávání.'
  ja: 'バックグラウンドでライブラリを解析しますが、再生中は一時停止するため再生に影響しません。'
settings.loudnessFullDesc:
  en: 'Analyzes your whole library as fast as possible, even during playback. Finishes soonest, uses more CPU.'
  de: 'Analysiert die gesamte Bibliothek so schnell wie möglich, auch während der Wiedergabe. Am schnellsten fertig, nutzt aber mehr CPU.'
  es: 'Analiza toda tu biblioteca lo más rápido posible, incluso durante la reproducción. Termina antes, usa más CPU.'
  zh: '尽可能快地分析整个音乐库，即使在播放时也是如此。最快完成，但占用更多 CPU。'
  cs: 'Analyzuje celou knihovnu co nejrychleji, i během přehrávání. Dokončí nejdříve, využívá více CPU.'
  ja: '再生中でもライブラリ全体をできるだけ速く解析します。最も早く完了しますが、CPU 使用量が増えます。'
