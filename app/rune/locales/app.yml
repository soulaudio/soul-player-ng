settings.indexingAutoDesc:
  en: 'Scans faster when your computer is idle and eases off when you are busy, so it stays out of your way.'
  de: 'Scannt schneller, wenn der Computer im Leerlauf ist, und bremst ab, wenn Sie beschäftigt sind, so stört es nie.'
  es: 'Escanea más rápido cuando el equipo está inactivo y afloja cuando estás ocupado, para no molestar.'
  zh: '电脑空闲时扫描更快，繁忙时自动放缓，始终不打扰你。'
  cs: 'Skenuje rychleji, když je počítač nečinný, a zpomalí, když pracujete, nikdy nepřekáží.'
  ja: 'パソコンが空いているときは速く、使用中は控えめにスキャンし、作業の邪魔をしません。'
settings.indexingMaxDesc:
  en: 'Always scans as fast as possible, best for a big first import. May briefly slow other apps.'
  de: 'Scannt immer so schnell wie möglich, ideal für den ersten großen Import. Kann andere Apps kurz verlangsamen.'
  es: 'Escanea siempre lo más rápido posible: ideal para una primera importación grande. Puede ralentizar otras apps un momento.'
  zh: '始终以最快速度扫描，适合首次大量导入。可能会短暂影响其他应用。'
  cs: 'Vždy skenuje co nejrychleji, ideální pro první velký import. Může krátce zpomalit jiné aplikace.'
  ja: '常に最速でスキャンします。初回の大量取り込みに最適。他のアプリが一時的に遅くなることがあります。'
settings.indexingGentleDesc:
  en: 'Goes easy on your computer and network drives (NAS). Slower, but you will barely notice it.'
  de: 'Schont Computer und Netzlaufwerke (NAS). Langsamer, aber kaum spürbar.'
  es: 'Es amable con tu equipo y unidades de red (NAS). Más lento, pero apenas lo notarás.'
  zh: '对电脑和网络驱动器（NAS）更温和。速度较慢，但几乎察觉不到。'
  cs: 'Šetří počítač i síťové disky (NAS). Pomalejší, ale téměř nepostřehnutelné.'
  ja: 'パソコンやネットワークドライブ（NAS）にやさしい設定。遅くなりますが、ほとんど気になりません。'
settings.loudnessAnalysis:
