name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (fmt · clippy · test — service + host)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # soul-audio-core is a private git dependency during the pre-public phase.
      CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Authenticate the private soul-audio-core git dependency
        if: ${{ env.CORE_REPO_TOKEN != '' }}
        run: git config --global url."https://x-access-token:${CORE_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"

      # soul-player-host links cpal → ALSA on Linux.
      - name: Audio build deps (cpal/ALSA)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Set up Rust
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            .
            crates/soul-player-host

      - name: Format (service + host)
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path crates/soul-player-host/Cargo.toml --all -- --check

      - name: Clippy (service + host)
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --manifest-path crates/soul-player-host/Cargo.toml --all-targets -- -D warnings

      - name: Test (service + host)
        run: |
          cargo test
          cargo test --manifest-path crates/soul-player-host/Cargo.toml

  rune:
    name: rune (fmt · clippy · test — native UI head)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
    defaults:
      run:
        working-directory: app/rune
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Authenticate the private soul-audio-core git dependency
        if: ${{ env.CORE_REPO_TOKEN != '' }}
        working-directory: .
        run: git config --global url."https://x-access-token:${CORE_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"

      # Rune = wgpu + winit; needs GPU/windowing libs + a software Vulkan adapter
      # (Lavapipe via mesa-vulkan-drivers) to render headlessly under Xvfb. Plus
      # ALSA for the host's cpal.
      - name: GPU/windowing deps + software Vulkan
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libxkbcommon-dev libwayland-dev \
            mesa-vulkan-drivers vulkan-tools libasound2-dev pkg-config xvfb

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app/rune

      # app/rune/rust-toolchain.toml pins the nightly (rune uses unstable compiler
      # features); the first cargo invocation auto-installs it + clippy/rustfmt.
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (headless, software Vulkan under Xvfb)
        run: xvfb-run -a cargo test

  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs: [rust, rune]
    if: always()
    steps:
      - name: Require all checks to pass
        run: |
          if [ "${{ needs.rust.result }}" != "success" ] || [ "${{ needs.rune.result }}" != "success" ]; then
            echo "::error::a required CI job failed"
            exit 1
          fi
          echo "all green"
