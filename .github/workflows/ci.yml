name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # on-demand (e.g. to validate after re-enabling)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (service + host)
    # Run the whole suite on Linux, Windows, and macOS so platform regressions
    # (paths, audio backend, toolchain) are caught. fmt + clippy are
    # platform-independent and run once (Linux); every OS still compiles
    # everything via `cargo test`.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # soul-audio-core is a private git dependency during the pre-public phase.
      CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
    defaults:
      run:
        shell: bash # available on all three runners; keeps one syntax everywhere
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Authenticate the private soul-audio-core git dependency
        if: ${{ env.CORE_REPO_TOKEN != '' }}
        run: git config --global url."https://x-access-token:${CORE_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"

      # soul-player-host links cpal → ALSA on Linux. Windows uses WASAPI and macOS
      # CoreAudio, which need no extra packages. It also links keyring →
      # dbus-secret-service → libdbus-sys (the OS keychain / Secret Service),
      # which needs libdbus-1-dev at build time on Linux, and reqwest →
      # native-tls → openssl-sys, which needs libssl-dev. (libssl-dev happens to
      # be preinstalled on ubuntu-latest, so the build passed here without it
      # while failing on a clean Linux box — it is declared explicitly so this
      # list is the real dependency set, not the runner image's leftovers.)
      - name: Audio + keychain + TLS build deps (cpal/ALSA, D-Bus, OpenSSL — Linux only)
        if: runner.os == 'Linux'
        run: |
          # Ubuntu's apt mirrors intermittently stall under GitHub Actions fleet
          # load (actions/runner-images#14823, #15297), which a single apt-get
          # surfaces as a hard "Could not wait for server fd" error instead of a
          # clean retry. Retry update+install so a transient mirror hiccup
          # self-heals rather than failing the job.
          for attempt in 1 2 3 4 5; do
            if sudo apt-get update \
              && sudo apt-get install -y -o Acquire::Retries=3 \
                   libasound2-dev libdbus-1-dev libssl-dev pkg-config; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed, retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "::error::apt-get failed after 5 attempts"; exit 1

      - name: Set up Rust components (Linux — for fmt/clippy)
        if: runner.os == 'Linux'
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: |
            .
            crates/soul-player-host

      - name: Format (service + host)
        if: runner.os == 'Linux'
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path crates/soul-player-host/Cargo.toml --all -- --check

      - name: Clippy (service + host)
        if: runner.os == 'Linux'
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --manifest-path crates/soul-player-host/Cargo.toml --all-targets -- -D warnings

      - name: Test (service + host)
        run: |
          cargo test
          cargo test --manifest-path crates/soul-player-host/Cargo.toml

      # macOS real-device e2e for CoreAudio exclusive output, against a BlackHole
      # virtual device (hosted runners have no audio hardware): every track at its native
      # rate through the full PlayerHandle stack, honest fallback for over-max rates,
      # exclusive-off releases hog mode and restores the rate, and strict/non-strict
      # behaviour when another process hogs the device. BlackHole (GPL-3.0) is a CI-only
      # fixture, never linked or shipped.
      - name: Install BlackHole virtual audio device (macOS only)
        if: runner.os == 'macOS'
        run: |
          brew install --cask blackhole-2ch
          brew install switchaudio-osx
          sudo killall -9 coreaudiod || true
          for i in $(seq 1 30); do
            if system_profiler SPAudioDataType | grep -q "BlackHole 2ch"; then break; fi
            sleep 1
          done
          system_profiler SPAudioDataType | grep -q "BlackHole 2ch" || { echo "::error::BlackHole did not load"; exit 1; }
          # native_rate_hardware_e2e plays on the system default.
          SwitchAudioSource -s "BlackHole 2ch" -t output

      - name: CoreAudio exclusive e2e on BlackHole (macOS only)
        if: runner.os == 'macOS'
        env:
          SOUL_CA_DEVICE: BlackHole 2ch
        run: >
          cargo test --manifest-path crates/soul-player-host/Cargo.toml
          --test coreaudio_exclusive_e2e --test native_rate_hardware_e2e --
          --ignored --nocapture --test-threads=1

  rune:
    name: rune (native UI head)
    # The UI head's interaction tests click focusable controls, which routes
    # through rune's window/GPU/accessibility stack. Linux provides it headlessly
    # (Xvfb + software Vulkan + accesskit-unix) and macOS has Metal + a login
    # session; the headless Windows runner has no window session, so a focus
    # change on click aborts the process (STATUS_ACCESS_VIOLATION). The rune head
    # still builds + bundles on Windows (release.yml) and runs on a real Windows
    # desktop — only this headless UI test run skips it. The Windows-sensitive
    # logic (paths, audio backend, config) is covered by the `rust` job on all
    # three OSes.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: app/rune
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Authenticate the private soul-audio-core git dependency
        if: ${{ env.CORE_REPO_TOKEN != '' }}
        working-directory: .
        run: git config --global url."https://x-access-token:${CORE_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"

      # Rune = wgpu + winit. The headless tests don't open a window, but on Linux
      # the test binary still needs GPU/windowing libs + a software Vulkan adapter
      # (Lavapipe via mesa-vulkan-drivers) under Xvfb to link/initialize. Windows
      # and macOS link their native windowing/graphics and run `cargo test`
      # directly. Plus ALSA for the host's cpal on Linux.
      - name: GPU/windowing deps + software Vulkan (Linux only)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          # Retry update+install so a transient Ubuntu apt-mirror stall
          # (actions/runner-images#14823) self-heals rather than failing the job.
          for attempt in 1 2 3 4 5; do
            if sudo apt-get update \
              && sudo apt-get install -y -o Acquire::Retries=3 \
                   libxkbcommon-x11-0 libxkbcommon-dev libwayland-dev libxcb1-dev \
                   mesa-vulkan-drivers vulkan-tools libasound2-dev libdbus-1-dev libssl-dev pkg-config xvfb; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed, retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "::error::apt-get failed after 5 attempts"; exit 1

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: app/rune

      # app/rune/rust-toolchain.toml pins the nightly (rune uses unstable compiler
      # features); the first cargo invocation auto-installs it. fmt + clippy are
      # platform-independent, so they run once (Linux).
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (headless)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a cargo test
          else
            cargo test
          fi

      # macOS e2e against the system Now Playing service (what Control Center, the lock
      # screen, media keys and AirPods read/drive): the real app autoplays silent tagged
      # tracks into a BlackHole output; `media-control` asserts metadata + artwork and
      # sends remote commands — shared, then hog-mode exclusive. Non-blocking until it has
      # been seen green on hosted runners (needs a GUI login session for MediaRemote).
      - name: Now Playing e2e (macOS only)
        if: runner.os == 'macOS'
        continue-on-error: true
        working-directory: .
        run: |
          brew install media-control switchaudio-osx
          brew install --cask blackhole-2ch
          sudo killall -9 coreaudiod || true
          for i in $(seq 1 30); do
            system_profiler SPAudioDataType | grep -q "BlackHole 2ch" && break; sleep 1
          done
          SwitchAudioSource -s "BlackHole 2ch" -t output
          scripts/e2e-now-playing-macos.sh
          EXCLUSIVE=1 scripts/e2e-now-playing-macos.sh

  rune-wayland:
    name: rune (Wayland)
    # The `rune` job above runs under Xvfb — X11 only. Wayland is the default
    # session on most current Linux desktops AND a materially different path:
    # winit picks a different backend, wgpu a different surface, and (the reason
    # this job exists) Rune places no window controls there, so the app draws its
    # own. A Wayland-specific regression is invisible to an Xvfb run by
    # construction, which is exactly how the "no _ [] X on Wayland" bug shipped.
    #
    # wlroots' headless backend gives a real compositor with no monitor and no
    # input hardware; `WLR_RENDERER=pixman` keeps the COMPOSITOR off the GPU,
    # while the app still gets software Vulkan from mesa (Lavapipe).
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: app/rune
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Authenticate the private soul-audio-core git dependency
        if: ${{ env.CORE_REPO_TOKEN != '' }}
        working-directory: .
        run: git config --global url."https://x-access-token:${CORE_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Wayland compositor + build deps
        working-directory: .
        run: |
          for attempt in 1 2 3 4 5; do
            if sudo apt-get update \
              && sudo apt-get install -y -o Acquire::Retries=3 \
                   sway \
                   libxkbcommon-dev libwayland-dev libxcb1-dev \
                   mesa-vulkan-drivers vulkan-tools \
                   xwayland pulseaudio pulseaudio-utils libasound2-plugins dbus-x11 \
                   libasound2-dev libdbus-1-dev libssl-dev pkg-config; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed, retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "::error::apt-get failed after 5 attempts"; exit 1

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: app/rune

      - name: Test (headless Wayland)
        # The suite runs as a CHILD of sway (its config's `exec`) so it inherits
        # the compositor's full session environment — both WAYLAND_DISPLAY and
        # the Xwayland DISPLAY. That matters: a real Wayland desktop always has
        # Xwayland running, winit still prefers Wayland when WAYLAND_DISPLAY is
        # set, and parts of the suite wedge in a Wayland session with no X at
        # all — a configuration no actual user has.
        #
        # Presetting WAYLAND_DISPLAY instead would make sway try to NEST inside
        # an existing compositor rather than take its headless backend.
        #
        # `timeout` bounds the whole thing: a wedged compositor or test must
        # FAIL the job, never hang it until GitHub's own limit.
        run: |
          # A runner has no XDG_RUNTIME_DIR of its own, and BOTH the audio server
          # and the compositor put their sockets there — if they disagree, the app
          # finds no sink and the session E2E sees a player that never plays.
          export XDG_RUNTIME_DIR=/tmp/soul-ci-runtime
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          export WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1
          unset WAYLAND_DISPLAY DISPLAY
          rm -f /tmp/test-status

          # The whole session — audio server included — runs inside ONE
          # `dbus-run-session`, as a script file rather than a nested-quoted
          # `sh -c`. PulseAudio is a session service: started outside this bus it
          # is a different session, and clients inside it get "Connection
          # refused" however healthy the daemon looks from the step that spawned
          # it. That is exactly what the first version of this job did.
          cat > /tmp/run-tests.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -o pipefail
          cd "$GITHUB_WORKSPACE/app/rune"

          # A CI runner has NO sound card, and the session E2E needs playback to
          # really run: the player's offline sink can't stand in, because it
          # discards writes with no backpressure, so a track "plays" instantly and
          # there is never a playing state to observe. A PulseAudio null sink is
          # the portable answer — `snd-dummy` is not in the runner image's kernel
          # modules. `libasound2-plugins` supplies the ALSA->Pulse bridge cpal opens.
          # Started in the FOREGROUND, backgrounded by the shell, with its log on
          # stderr: `pulseaudio -D` daemonizes through a fork whose startup
          # failures never reached this log, which is why the first attempts here
          # failed with a bare "Connection refused" and nothing to diagnose.
          # `module-native-protocol-unix` is NOT optional here: `-n` skips
          # `default.pa`, which is what normally loads it, so without this the
          # daemon starts and runs happily while listening on nothing at all —
          # every client gets "Connection refused" from a process that looks
          # perfectly healthy in `ps`. That is precisely what failed here before.
          pulseaudio --exit-idle-time=-1 --disallow-exit -n \
            --log-target=stderr --log-level=notice \
            --load="module-native-protocol-unix" \
            --load="module-null-sink sink_name=ci_sink" \
            --load="module-always-sink" &
          pulse_pid=$!

          # Poll rather than assume readiness: the daemon has to bind its socket
          # and load both modules before a client can connect, and a race here
          # looks exactly like a broken sink.
          # `pactl info` is the real check — it proves a CLIENT in this session
          # can reach the daemon, which `pulseaudio --check` does not.
          for _ in $(seq 1 30); do
            pactl info >/dev/null 2>&1 && break
            kill -0 "$pulse_pid" 2>/dev/null || break
            sleep 1
          done
          if ! pactl info; then
            echo "::error::no reachable PulseAudio sink in this session"
            # Without a sink every playback assertion fails for a reason that is
            # not a code bug, so stop here — and say what was actually running.
            jobs -l || true
            exit 1
          fi

          cargo test --locked \
            && cargo test --locked --test linux_session_e2e -- --ignored --test-threads=1
          SCRIPT
          chmod +x /tmp/run-tests.sh

          # `dbus-run-session` gives the app a session bus: without one it
          # publishes no MPRIS session, and every assertion in the session E2E
          # would have nothing to read.
          cat > /tmp/sway-ci.conf <<'CONF'
          default_border none
          exec "dbus-run-session -- /tmp/run-tests.sh; echo $? > /tmp/test-status; swaymsg exit"
          CONF
          timeout 30m sway -c /tmp/sway-ci.conf || true
          status=$(cat /tmp/test-status 2>/dev/null || echo 1)
          echo "cargo test exited $status"
          exit "$status"

  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs: [rust, rune, rune-wayland]
    if: always()
    steps:
      - name: Require all checks to pass
        # For a matrix job, `needs.<job>.result` is success only when EVERY matrix
        # leg (ubuntu/windows/macos) succeeded — so this gate covers all platforms.
        run: |
          if [ "${{ needs.rust.result }}" != "success" ] \
            || [ "${{ needs.rune.result }}" != "success" ] \
            || [ "${{ needs.rune-wayland.result }}" != "success" ]; then
            echo "::error::a required CI job failed"
            exit 1
          fi
          echo "all green"
