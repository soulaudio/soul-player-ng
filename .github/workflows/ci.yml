name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (fmt · clippy · test — service + app)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # soul-audio-core is a private git dependency during the pre-public phase.
      # Set a read-only PAT as the CORE_REPO_TOKEN repo secret; once the library
      # repo is public this is unnecessary and the auth step auto-skips.
      CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Authenticate the private soul-audio-core git dependency
        if: ${{ env.CORE_REPO_TOKEN != '' }}
        run: git config --global url."https://x-access-token:${CORE_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"

      # Tauri + cpal build dependencies (webview, GTK, ALSA). The app crate links
      # these even though its tests run offline over NullSink.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev librsvg2-dev \
            libayatana-appindicator3-dev libasound2-dev pkg-config patchelf

      # rust-toolchain.toml pins the channel; add the components explicitly so a
      # missing one fails fast.
      - name: Set up Rust
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            .
            app/src-tauri

      # `generate_context!()` reads `frontendDist` (../dist) at COMPILE time, so a
      # dist must exist to build/clippy/test the app crate (the real one is built
      # by the frontend job).
      - name: Mock frontend dist
        run: |
          mkdir -p app/dist
          printf '<!doctype html><title>soul-player</title><div id="app"></div>' > app/dist/index.html

      - name: Format (service + app)
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path app/src-tauri/Cargo.toml --all -- --check

      - name: Clippy (service + app)
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --manifest-path app/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test (service + app)
        run: |
          cargo test
          cargo test --manifest-path app/src-tauri/Cargo.toml

  frontend:
    name: frontend (svelte-check · vitest · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Type-check (svelte-check)
        run: npm run check
      - name: Install Playwright Chromium (vitest browser mode)
        run: npx playwright install --with-deps chromium
      - name: Unit tests (vitest)
        run: npm run test
      - name: Production build (vite)
        run: npm run build

  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs: [rust, frontend]
    if: always()
    steps:
      - name: Require all checks to pass
        run: |
          if [ "${{ needs.rust.result }}" != "success" ] || [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "::error::a required CI job failed"
            exit 1
          fi
          echo "all green"
