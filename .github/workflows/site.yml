name: Site

# player.soulaudio.co. Built from website/ and published to a Bunny storage
# zone behind a pull zone.
#
# The release trigger is the one that matters: release asset filenames carry
# the version, so without a redeploy the download buttons keep pointing at the
# previous release.
#
# release.yml calls this as a reusable workflow rather than firing a
# repository_dispatch at it, because an event raised with GITHUB_TOKEN does not
# start another workflow run, and the alternative would be keeping a PAT around
# solely to work around that.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "packaging/install.sh"
      - "docs/screenshots/albums-dark.png"
      - ".github/workflows/site.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A newer deploy supersedes an older one: publishing two builds concurrently to
# one storage zone would interleave uploads and deletes.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    name: build + publish
    runs-on: ubuntu-latest
    env:
      BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
      BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
      BUNNY_STORAGE_ENDPOINT: ${{ secrets.BUNNY_STORAGE_ENDPOINT }}
      BUNNY_PULLZONE_ID: ${{ secrets.BUNNY_PULLZONE_ID }}
      BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      - name: Build
        env:
          # Lifts the unauthenticated rate limit on the latest-release lookup.
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      # Until the Bunny zones exist the build still runs on every push, which is
      # the half that catches a broken page. Publishing is skipped with a notice
      # rather than failing, the same posture as the Homebrew tap push.
      - name: Publish to Bunny
        if: env.BUNNY_STORAGE_ZONE != ''
        run: node scripts/deploy-bunny.mjs

      - name: Publishing skipped
        if: env.BUNNY_STORAGE_ZONE == ''
        run: echo "::notice::BUNNY_* secrets are not set, so the build was not published."
