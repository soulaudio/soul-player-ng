name: Site

# player.soulaudio.co. Built from website/ and published to the Bunny storage
# zone that website/infrastructure manages.
#
# Keeping the page in sync with the current release takes three triggers,
# because any one of them can miss:
#
#   release.yml  calls this once a release verifies. The normal path, and the
#                fast one. Asset filenames carry the version, so without it the
#                download buttons keep pointing at the previous release.
#   schedule     the backstop. Catches a deploy that failed, a release edited
#                or withdrawn by hand, and anything else that happened without
#                a push. It compares the live /version.json against the latest
#                release and only builds when the site has actually fallen
#                behind, so a quiet week costs nothing but the check.
#   push         website/ or the installer changed, so the page changed.
#
# release.yml calls this as a reusable workflow rather than firing a
# repository_dispatch at it, because an event raised with GITHUB_TOKEN does not
# start another workflow run, and the alternative would be keeping a PAT around
# solely to work around that.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "!website/infrastructure/**"
      - "packaging/install.sh"
      - "docs/screenshots/albums-dark.png"
      - ".github/workflows/site.yml"
  schedule:
    # Every six hours. The release path already redeploys within minutes, so
    # this only has to catch the cases that path misses.
    - cron: "41 */6 * * *"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A newer deploy supersedes an older one: publishing two builds concurrently to
# one storage zone would interleave uploads and deletes.
concurrency:
  group: site
  cancel-in-progress: false

env:
  SITE_URL: https://player.soulaudio.co

jobs:
  deploy:
    name: build + publish
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://player.soulaudio.co
    env:
      BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_STATE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_STATE_SECRET_KEY }}
      TF_VAR_zone_id: ${{ vars.SOULAUDIO_ZONE_ID }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
        working-directory: website

      - name: Build
        working-directory: website
        env:
          # Lifts the unauthenticated rate limit on the latest-release lookup.
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      # Where the zone name, its write password, and the pull zone id come
      # from. Reading them out of the state that created them beats copying
      # four values into repository secrets by hand: one source of truth, and
      # nothing to re-copy when a zone is recreated.
      - name: Credentials present?
        id: creds
        run: |
          if [ -n "$BUNNYNET_API_KEY" ] && [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$TF_VAR_zone_id" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Bunny and state credentials are not set, so the build was not published."
          fi

      - uses: hashicorp/setup-terraform@v4.0.1
        if: steps.creds.outputs.ready == 'true'
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false

      - name: Read the zone details from terraform
        id: tf
        if: steps.creds.outputs.ready == 'true'
        working-directory: website/infrastructure
        run: |
          set -euo pipefail
          terraform init -backend-config=backend.hcl
          password=$(terraform output -raw storage_password)
          # Mask it before it can reach a log line.
          echo "::add-mask::$password"
          {
            echo "zone=$(terraform output -raw storage_zone)"
            echo "password=$password"
            echo "endpoint=$(terraform output -raw storage_endpoint)"
            echo "pullzone=$(terraform output -raw pullzone_id)"
          } >> "$GITHUB_OUTPUT"

      # On a schedule there is usually nothing to do. Deploying anyway would
      # purge the cache every six hours for no reason, so compare first: the
      # build knows the latest version, the live site says what it is serving.
      # Any other trigger means the page itself may have changed, so it always
      # deploys.
      - name: Is the live site behind?
        id: check
        working-directory: website
        run: |
          set -uo pipefail
          built=$(jq -r .version dist/version.json)
          echo "built=$built" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Cache-busting query so this reads the origin, not an edge copy.
          live=$(curl -fsS --max-time 20 "$SITE_URL/version.json?t=$RANDOM" | jq -r .version || echo unreachable)
          if [ "$live" = "$built" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Live site is on $live, the latest release. Nothing to do."
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Live site is on $live but the latest release is $built. Redeploying."
          fi

      - name: Publish to Bunny
        if: steps.creds.outputs.ready == 'true' && steps.check.outputs.stale == 'true'
        working-directory: website
        env:
          BUNNY_STORAGE_ZONE: ${{ steps.tf.outputs.zone }}
          BUNNY_STORAGE_PASSWORD: ${{ steps.tf.outputs.password }}
          BUNNY_STORAGE_ENDPOINT: ${{ steps.tf.outputs.endpoint }}
          BUNNY_PULLZONE_ID: ${{ steps.tf.outputs.pullzone }}
          BUNNY_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
        run: node scripts/deploy-bunny.mjs

      # A deploy that uploads cleanly can still leave the old page in front of
      # people: a cache rule that holds HTML too long, a purge that did not
      # take. Checking afterwards turns that into a red run instead of a page
      # nobody notices is stale.
      - name: Confirm the live site serves this version
        if: steps.creds.outputs.ready == 'true' && steps.check.outputs.stale == 'true'
        run: |
          set -uo pipefail
          built="${{ steps.check.outputs.built }}"
          for attempt in 1 2 3 4 5; do
            live=$(curl -fsS --max-time 20 "$SITE_URL/version.json?t=$RANDOM" | jq -r .version || echo unreachable)
            if [ "$live" = "$built" ]; then
              echo "::notice::$SITE_URL is serving $live."
              exit 0
            fi
            echo "attempt $attempt: live is $live, expected $built"
            sleep 10
          done
          echo "::error::$SITE_URL still serves $live after the deploy and purge; expected $built."
          exit 1
