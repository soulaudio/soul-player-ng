name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly-disclosed advisories surface without a push.
    - cron: "27 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---- Blocking gates ------------------------------------------------------

  audit:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    # cargo-audit reads only the lockfiles (no source fetch), so the private core
    # dependency needs no auth here. Pin the shim to stable: the prebuilt binary
    # is toolchain-independent.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-audit
      - name: Scan both lockfiles
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file app/rune/Cargo.lock

  deny:
    name: cargo-deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Authenticate the private soul-audio-core git dependency
        if: ${{ env.CORE_REPO_TOKEN != '' }}
        run: git config --global url."https://x-access-token:${CORE_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          # Pinned: cargo-deny moved `--config` between a global flag and a
          # `check` subcommand flag across releases; pin so the invocation below
          # (`check --config …`) matches what CI installs.
          tool: cargo-deny@0.19.0
      # The root (headless `soul-player-backend`) workspace bans GUI/platform
      # crates via deny.toml; the Rune UI head legitimately uses them (wgpu/winit)
      # and consumes `rune` as a git dep, so it gets its own deny.app.toml (no GUI
      # ban + the rune git source allowed). See docs/ARCHITECTURE.md.
      - name: Check root workspace (headless — no GUI)
        run: cargo deny --manifest-path Cargo.toml check bans licenses sources
      - name: Check Rune app workspace
        run: cargo deny --manifest-path app/rune/Cargo.toml check --config deny.app.toml bans licenses sources

  secrets:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The gitleaks Action requires a paid licence for GitHub orgs; the CLI is
      # free, so pin + run the binary directly. `dir` scans the working tree.
      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan for committed secrets
        run: gitleaks dir . --redact --no-banner --verbose

  # ---- Informational (surface, never block on transitive/dev noise) --------

  osv-scanner:
    name: OSV-Scanner (informational)
    runs-on: ubuntu-latest
    # The Rune head drags in a large transitive wgpu/winit/GPU tree whose
    # unmaintained / unsoundness notices can't be fixed here; OSV surfaces the
    # broader OSV.dev DB into the run summary without failing CI. The blocking
    # Rust gate is `cargo audit` above. (Lesson from the soul-player monorepo:
    # don't hard-fail scheduled scans on un-actionable transitive noise — report
    # it.)
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install OSV-Scanner
        run: |
          curl -sSL -o /usr/local/bin/osv-scanner "https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64"
          chmod +x /usr/local/bin/osv-scanner
      - name: Scan all lockfiles → run summary
        run: |
          echo '## OSV-Scanner' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          osv-scanner scan source \
            -L Cargo.lock \
            -L app/rune/Cargo.lock 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Generate SBOM from the lockfiles
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json
