name: Installer

# Tests the PUBLISHED installer the way a user runs it: pipe what
# player.soulaudio.co serves into a shell and let it resolve the latest
# release itself.
#
# Covers the chain a release-artifact test cannot see: site deployed,
# installer served, latest.json current, every asset downloadable, checksums
# matching, package manager accepting the package, installed binary running.
# 0.4.6 shipped with one rpm asset returning 500 from GitHub while every other
# asset was fine, and nothing in CI would have caught it.
#
# Two entry points, one body:
#   workflow_call      release.yml runs it after the site redeploys, and a
#                      failure here rolls the release back
#   workflow_dispatch  run it against any published release, any time
on:
  workflow_call:
    inputs:
      version:
        description: "Version the installer is expected to land, e.g. 0.4.7"
        required: true
        type: string
      skip-run-check:
        description: "Skip `soul-player --version`, for releases older than the one that fixed it"
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: "Version to expect (blank: accept whatever the installer resolves)"
        required: false
        type: string
      skip-run-check:
        description: "Skip `soul-player --version` (needed for 0.4.6 and older)"
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64
          - name: "Ubuntu 24.04 deb (x86_64)"
            runner: ubuntu-24.04
            image: "ubuntu:24.04"
            mode: deb
            prep: "apt-get update -qq && apt-get install -y -qq curl ca-certificates sudo"
          - name: "Debian 12 deb (x86_64)"
            runner: ubuntu-24.04
            image: "debian:12"
            mode: deb
            prep: "apt-get update -qq && apt-get install -y -qq curl ca-certificates sudo"
          - name: "Fedora 42 rpm (x86_64)"
            runner: ubuntu-24.04
            image: "fedora:42"
            mode: rpm
            prep: "dnf install -y -q curl sudo"
          - name: "openSUSE zypper rpm (x86_64)"
            runner: ubuntu-24.04
            image: "opensuse/tumbleweed"
            mode: rpm
            prep: "zypper --non-interactive --quiet install curl"
          - name: "Arch AppImage fallback (x86_64)"
            runner: ubuntu-24.04
            image: "archlinux:latest"
            mode: appimage
            prep: "pacman -Sy --noconfirm --quiet curl"
          # Below the glibc floor: the installer must refuse rather than
          # install something that cannot start.
          - name: "AlmaLinux 8 must refuse (x86_64)"
            runner: ubuntu-24.04
            image: "almalinux:8"
            mode: refuse
            prep: "dnf install -y -q curl"
          # aarch64. Different assets entirely (arm64.deb, aarch64.rpm,
          # aarch64.AppImage), so x86_64 passing says nothing about them.
          - name: "Ubuntu 24.04 deb (aarch64)"
            runner: ubuntu-24.04-arm
            image: "ubuntu:24.04"
            mode: deb
            prep: "apt-get update -qq && apt-get install -y -qq curl ca-certificates sudo"
          - name: "Fedora 42 rpm (aarch64)"
            runner: ubuntu-24.04-arm
            image: "fedora:42"
            mode: rpm
            prep: "dnf install -y -q curl sudo"
          - name: "Debian 12 AppImage (aarch64)"
            runner: ubuntu-24.04-arm
            image: "debian:12"
            mode: appimage
            # No package manager the installer knows: apt is removed from PATH
            # for the run, so it takes the AppImage fallback on arm too.
            prep: "apt-get update -qq && apt-get install -y -qq curl ca-certificates && rm -f /usr/bin/apt-get /usr/bin/dpkg"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install through the published script
        env:
          SOUL_PLAYER_SKIP_RUN_CHECK: ${{ inputs.skip-run-check && '1' || '' }}
        run: |
          docker run --rm \
            -e SOUL_PLAYER_SKIP_RUN_CHECK \
            -v "$PWD/packaging/test-install.sh:/test-install.sh:ro" \
            "${{ matrix.image }}" \
            sh -c '${{ matrix.prep }} >/dev/null 2>&1 || true; sh /test-install.sh ${{ matrix.mode }} ${{ inputs.version }}'
