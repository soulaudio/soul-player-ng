name: Installer

# Tests the installer (packaging/install.sh) the way a user runs it, through
# its whole life on every system it supports: install the previous release,
# update to the new one, run it again, uninstall, reinstall, uninstall --purge,
# each step checked (packaging/test-install.sh).
#
# Two sources, one body:
#   candidate  BEFORE publishing (release.yml): this commit's install.sh against
#              a local mirror of the release candidate's exact files. A failure
#              here stops the release and deletes the draft.
#   published  AFTER publishing (release.yml, after the site redeploys) or by
#              hand: pipe what player.soulaudio.co serves into a shell and let it
#              resolve the latest release itself. Covers what the mirror cannot:
#              the site deployed, latest.json current, every asset downloadable
#              (0.4.6 shipped with one rpm returning 500 from GitHub). A failure
#              in a release rolls the release back.
on:
  workflow_call:
    inputs:
      version:
        description: "Version the installer is expected to land, e.g. 0.4.7"
        required: true
        type: string
      previous:
        description: "Release to install first and update from (tag or version; blank: no update step)"
        default: ""
        type: string
      candidate:
        description: "Serve the release-candidate-* artifacts of the calling run instead of the live site"
        default: false
        type: boolean
      skip-run-check:
        description: "Skip `soul-player --version`, for releases older than the one that fixed it"
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: "Version to expect (blank: accept whatever the installer resolves)"
        required: false
        type: string
      previous:
        description: "Release to install first and update from, e.g. 0.4.6 (blank: no update step)"
        required: false
        type: string
      skip-run-check:
        description: "Skip `soul-player --version` (needed for 0.4.6 and older)"
        default: false
        type: boolean

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}
  PREVIOUS: ${{ inputs.previous }}
  SOUL_PLAYER_SKIP_RUN_CHECK: ${{ inputs.skip-run-check && '1' || '' }}

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64
          - name: "Ubuntu 24.04 deb (x86_64)"
            runner: ubuntu-24.04
            image: "ubuntu:24.04"
            mode: deb
            assets: "*_amd64.deb"
            prep: "apt-get update -qq && apt-get install -y -qq curl ca-certificates sudo"
          - name: "Debian 12 deb (x86_64)"
            runner: ubuntu-24.04
            image: "debian:12"
            mode: deb
            assets: "*_amd64.deb"
            prep: "apt-get update -qq && apt-get install -y -qq curl ca-certificates sudo"
          - name: "Fedora 42 rpm (x86_64)"
            runner: ubuntu-24.04
            image: "fedora:42"
            mode: rpm
            assets: "*.x86_64.rpm"
            prep: "dnf install -y -q curl sudo"
          - name: "openSUSE zypper rpm (x86_64)"
            runner: ubuntu-24.04
            image: "opensuse/tumbleweed"
            mode: rpm
            assets: "*.x86_64.rpm"
            prep: "zypper --non-interactive --quiet install curl"
          # The AppImage carries most of its libraries but, like every AppImage,
          # expects the desktop's own sound and X11 client libraries (a desktop
          # always has them; a container image does not).
          - name: "Arch AppImage fallback (x86_64)"
            runner: ubuntu-24.04
            image: "archlinux:latest"
            mode: appimage
            assets: "*_x86_64.AppImage"
            prep: "pacman -Sy --noconfirm --quiet curl alsa-lib libxcb"
          # The oldest system the AppImage promises (glibc 2.35), with apt taken
          # away so the installer falls back to the AppImage.
          - name: "Ubuntu 22.04 AppImage (x86_64)"
            runner: ubuntu-24.04
            image: "ubuntu:22.04"
            mode: appimage
            assets: "*_x86_64.AppImage"
            prep: "apt-get update -qq && apt-get install -y -qq curl ca-certificates libasound2 libxcb1 && rm -f /usr/bin/apt-get /usr/bin/dpkg"
          # Below the glibc floor: the installer must refuse rather than
          # install something that cannot start.
          - name: "AlmaLinux 8 must refuse (x86_64)"
            runner: ubuntu-24.04
            image: "almalinux:8"
            mode: refuse
            assets: ""
            prep: "dnf install -y -q curl"
          # aarch64. Different assets entirely (arm64.deb, aarch64.rpm,
          # aarch64.AppImage), so x86_64 passing says nothing about them.
          - name: "Ubuntu 24.04 deb (aarch64)"
            runner: ubuntu-24.04-arm
            image: "ubuntu:24.04"
            mode: deb
            assets: "*_arm64.deb"
            prep: "apt-get update -qq && apt-get install -y -qq curl ca-certificates sudo"
          - name: "Fedora 42 rpm (aarch64)"
            runner: ubuntu-24.04-arm
            image: "fedora:42"
            mode: rpm
            assets: "*.aarch64.rpm"
            prep: "dnf install -y -q curl sudo"
          - name: "Debian 12 AppImage (aarch64)"
            runner: ubuntu-24.04-arm
            image: "debian:12"
            mode: appimage
            assets: "*_aarch64.AppImage"
            prep: "apt-get update -qq && apt-get install -y -qq curl ca-certificates libasound2 libxcb1 && rm -f /usr/bin/apt-get /usr/bin/dpkg"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4.3.0
        if: inputs.candidate
        with:
          name: release-candidate-linux
          path: mirror/download/v${{ inputs.version }}

      - name: Serve the candidate
        if: inputs.candidate
        env:
          GH_TOKEN: ${{ github.token }}
          ASSETS: ${{ matrix.assets }}
        run: bash packaging/serve-candidate.sh

      - name: Install, update, uninstall through the installer
        run: |
          docker run --rm --network host \
            -e SOUL_PLAYER_SKIP_RUN_CHECK -e SOUL_PLAYER_INSTALL_URL -e SOUL_PLAYER_RELEASES_URL \
            -v "$PWD/packaging/test-install.sh:/test-install.sh:ro" \
            "${{ matrix.image }}" \
            sh -c '${{ matrix.prep }} >/dev/null 2>&1 || true; sh /test-install.sh ${{ matrix.mode }} "$0" "$1"' "$VERSION" "${PREVIOUS#v}"

  # No container: the installer mounts a dmg and copies into /Applications,
  # which only means anything on a real Mac. Both architectures, since the one
  # universal DMG has to install and run natively on each.
  macos:
    name: macOS dmg (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4.3.0
        if: inputs.candidate
        with:
          name: release-candidate-macos
          path: mirror/download/v${{ inputs.version }}

      - name: Serve the candidate
        if: inputs.candidate
        env:
          GH_TOKEN: ${{ github.token }}
          ASSETS: "*_universal.dmg"
        run: bash packaging/serve-candidate.sh

      - name: Install, update, uninstall through the installer
        run: |
          [ "$(uname -m)" = "${{ matrix.arch }}" ] || { echo "::error::runner is $(uname -m), expected ${{ matrix.arch }}"; exit 1; }
          sh packaging/test-install.sh macos "$VERSION" "${PREVIOUS#v}"

      - name: Leave the runner clean
        if: always()
        run: sudo rm -rf "/Applications/Soul Player.app" "/Applications/.Soul Player.app.installing"
