name: Release

# TAG-TRIGGERED ONLY — never on push/PR. Cut a release by bumping
# app/rune/Cargo.toml, committing, then pushing a matching `vX.Y.Z` tag, or run it
# manually with the tag as input. `dry_run: true` builds, packages and verifies
# everything but publishes nothing (see app/rune/PACKAGING.md).
#
# It builds + SIGNS the bundles for each OS with the updater private key (a repo
# secret, independent of OS code-signing — see app/rune/src/update.rs), then
# publishes the installers plus `latest.json` (the update manifest) to a GitHub
# Release. The shipped app's launch-time check reads that manifest and offers an
# in-app "Install & Restart".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.2.0) — must match app/rune/Cargo.toml. Empty with dry_run: the manifest version."
        required: false
      dry_run:
        description: "Build, package and verify every platform, but publish nothing (artifacts stay on the run)"
        type: boolean
        default: false

permissions:
  contents: write # create the release and upload assets

env:
  # Generate the keypair once with `cargo packager signer generate`; store the
  # PRIVATE key as the UPDATER_PRIVATE_KEY secret and its password as
  # UPDATER_KEY_PASSWORD. The matching PUBLIC key is embedded in
  # app/rune/src/update.rs. Without these, packaging still succeeds but produces
  # no `.sig`, and the publish job will fail (empty signature) — by design.
  CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
  CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATER_KEY_PASSWORD }}

jobs:
  # Fail fast if the tag and the manifest version disagree: the installer name
  # and the running app's reported version both come from Cargo.toml, while the
  # manifest version comes from the tag — a mismatch ships an update that never
  # applies.
  guard:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          cargo_ver=$(grep -m1 '^version' app/rune/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
            if [ -z "$tag" ]; then
              [ "${{ github.event.inputs.dry_run }}" = "true" ] \
                || { echo "::error::a tag is required unless dry_run is set"; exit 1; }
              tag="v$cargo_ver"
            fi
          else
            tag="${{ github.ref_name }}"
          fi
          ver="${tag#v}"
          if [ "$ver" != "$cargo_ver" ]; then
            echo "::error::tag $tag implies version $ver but app/rune/Cargo.toml is $cargo_ver — bump the manifest and retag."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

  package:
    needs: guard
    strategy:
      fail-fast: false # a failed macOS job still ships Windows + Linux
      matrix:
        include:
          - os: windows-latest
            target_key: windows-x86_64
            format: nsis
          # macOS ships per architecture (no universal binary): Apple silicon and Intel.
          # Unsigned by Apple for now — the bundle carries a sealed ad-hoc signature
          # (Cargo.toml `packager.macos.signing-identity = "-"`); Developer ID +
          # notarization come later.
          - os: macos-15
            target_key: macos-aarch64
            format: app
            arch: arm64
            asset_arch: aarch64
          - os: macos-15-intel
            target_key: macos-x86_64
            format: app
            arch: x86_64
            asset_arch: x86_64
          - os: ubuntu-latest
            target_key: linux-x86_64
            format: appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        working-directory: app/rune # rust-toolchain.toml resolves from CWD
        run: rustup show

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Linux packaging dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Retry update+install so a transient Ubuntu apt-mirror stall
          # (actions/runner-images#14823) self-heals rather than failing the job.
          for attempt in 1 2 3 4 5; do
            if sudo apt-get update \
              && sudo apt-get install -y -o Acquire::Retries=3 \
                   libasound2-dev \
                   libdbus-1-dev \
                   libgtk-3-dev \
                   libxdo-dev \
                   librsvg2-dev \
                   libayatana-appindicator3-dev \
                   libfuse2; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed, retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "::error::apt-get failed after 5 attempts"; exit 1

      # cargo-packager only *packages* a pre-built binary — it does not build
      # one (its `--release` just selects the release-profile output). So build
      # first, then package; from app/rune the pinned nightly is used.
      - name: Build the release binary
        working-directory: app/rune
        run: cargo build --release

      - name: Package + sign
        working-directory: app/rune
        run: cargo packager --release -f ${{ matrix.format }}

      # Stages the signed artifact into dist/ under a GitHub-safe name (so the
      # manifest URL matches the uploaded asset) and writes its meta sidecar.
      - name: Stage artifact + write updater sidecar
        shell: bash # Windows defaults to PowerShell; this uses \ continuations
        run: |
          python .github/scripts/write-meta.py \
            --out-dir app/rune/target/release \
            --target-key ${{ matrix.target_key }} \
            --format ${{ matrix.format }} \
            --stage-dir dist \
            --meta-out dist/${{ matrix.target_key }}.meta.json \
            ${{ runner.os == 'macOS' && format('--asset-name Soul-Player_{0}_{1}.app.tar.gz', needs.guard.outputs.version, matrix.asset_arch) || '' }}

      # macOS: also ship a drag-to-Applications DMG for first installs (the updater
      # keeps using the signed .app.tar.gz above). Same binary, so no rebuild. Renamed
      # without spaces so the release asset URL is stable.
      - name: Package DMG (macOS)
        if: runner.os == 'macOS'
        working-directory: app/rune
        run: |
          rm -f target/release/*.dmg
          cargo packager --release -f dmg
          cp target/release/*.dmg "../../dist/Soul-Player_${{ needs.guard.outputs.version }}_${{ matrix.asset_arch }}.dmg"

      # Nothing ships unverified: the app inside the DMG must carry an intact sealed
      # signature, the right architecture / identity / version, and actually launch and
      # render; the updater tarball's signature must be intact too.
      - name: Verify the macOS bundle
        if: runner.os == 'macOS'
        run: |
          .github/scripts/verify-macos-bundle.sh \
            "${{ needs.guard.outputs.version }}" "${{ matrix.arch }}" \
            "dist/Soul-Player_${{ needs.guard.outputs.version }}_${{ matrix.asset_arch }}.dmg" \
            "dist/Soul-Player_${{ needs.guard.outputs.version }}_${{ matrix.asset_arch }}.app.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target_key }}
          path: dist/*

  publish:
    needs: [guard, package]
    if: ${{ github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate latest.json
        run: |
          python .github/scripts/gen-latest-json.py \
            --meta-dir dist \
            --repo ${{ github.repository }} \
            --tag ${{ needs.guard.outputs.tag }} \
            --version ${{ needs.guard.outputs.version }} \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --notes "Soul Player ${{ needs.guard.outputs.tag }}" \
            --out dist/latest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.guard.outputs.tag }}
          name: Soul Player ${{ needs.guard.outputs.tag }}
          # The installers users download, plus the manifest the in-app updater
          # reads from `latest/download/latest.json`. The *.meta.json sidecars
          # are deliberately not uploaded.
          files: |
            dist/*-setup.exe
            dist/*.AppImage
            dist/*.app.tar.gz
            dist/*.dmg
            dist/latest.json
          fail_on_unmatched_files: false
          generate_release_notes: true # grouped per .github/release.yml
          # Prepended to the generated notes.
          body: |
            ## Install

            - **macOS** — download the DMG for your Mac (`aarch64` = Apple silicon, `x86_64` = Intel) and drag Soul Player to Applications. The app isn't notarized by Apple yet, so the first launch is blocked: open **System Settings → Privacy & Security** and click **Open Anyway** (or run `xattr -dr com.apple.quarantine "/Applications/Soul Player.app"`). Later updates install in-app.
            - **Windows** — run the setup `.exe`. SmartScreen may say *unknown publisher*: **More info → Run anyway**.
            - **Linux** — `chmod +x` the AppImage and run it.
