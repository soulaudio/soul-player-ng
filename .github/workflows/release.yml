name: Release

# Cut a release by bumping app/Cargo.toml on main and pushing a matching `vX.Y.Z` tag
# (or run it manually with the tag). `dry_run: true` runs build + e2e on every platform
# and publishes nothing: use it on a branch before tagging (see app/PACKAGING.md).
#
#   guard ──► build (4 OS legs) ──► e2e (4 OS legs) ──► draft ──► publish ──► verify
#                                                          └────────┴─────────┴──► rollback (on failure)
#
# guard    the tag matches Cargo.toml, sits on main, and that commit passed CI; the
#          tag isn't already published.
# build    compile, package and updater-sign each platform; static bundle checks (macOS:
#          sealed signature, architecture, identity); upload the installers.
# e2e      on a fresh runner of each OS, with the exact installer that will ship:
#          fresh install → run (renders + playback) → uninstall; then upgrade from the
#          currently published release (which must see this one as an update) → rollback
#          to it → uninstall (.github/scripts/release-e2e.py).
# draft    a DRAFT release with the installers, latest.json and SHA256SUMS; the uploaded
#          bytes are re-downloaded and checked against the tested ones.
# publish  undraft and mark latest, only now do users and in-app updaters see it.
# verify   the public `latest/download/latest.json` serves this version and every
#          platform URL in it downloads the tested bytes.
# rollback anything failing after the draft exists: a draft is deleted; a published
#          release is demoted to pre-release and the previous release made latest again,
#          so updaters stop offering it. The tag is kept.
#
# Installers are updater-signed with UPDATER_PRIVATE_KEY (independent of OS code-signing,
# see app/src/update.rs). Apple/Windows code-signing is deferred: macOS ships with a
# sealed ad-hoc signature.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.4.0), must match app/Cargo.toml. Empty with dry_run: the manifest version."
        required: false
      dry_run:
        description: "Build + e2e every platform, publish nothing (installers stay as run artifacts)"
        type: boolean
        default: false
      rehearsal:
        description: "Dry run + a real DRAFT release under a throwaway tag (uploaded and verified, then deleted). Never published."
        type: boolean
        default: false

# One release at a time, and never cancel one half-way through publishing.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail everywhere, Windows included

env:
  CARGO_TERM_COLOR: always
  DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
  REHEARSAL: ${{ github.event.inputs.rehearsal == 'true' }}
  # How many platforms a complete release covers, one entry per leg of the
  # `build` matrix, and the number `latest.json` must carry for the in-app
  # updater to reach every user. Defined once because it was previously written
  # out as a literal `4` in three separate checks, which is three places to
  # forget when a platform is added (and the failure mode is a release that
  # verifies clean while silently offering no update to the new one).
  PLATFORMS: "5"

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      checks: read
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      previous: ${{ steps.v.outputs.previous }}
      update_from: ${{ steps.v.outputs.update_from }}
      # The release the draft job creates: the tag, or a throwaway one for a rehearsal.
      release_tag: ${{ steps.v.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          cargo_ver=$(grep -m1 '^version' app/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            if [ -z "$tag" ]; then
              [ "$DRY_RUN" = "true" ] || [ "$REHEARSAL" = "true" ] \
                || { echo "::error::a tag is required unless dry_run or rehearsal is set"; exit 1; }
              tag="v$cargo_ver"
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          ver="${tag#v}"
          # The installer names and the running app's version come from Cargo.toml, the
          # manifest version from the tag, a mismatch ships an update that never applies.
          [ "$ver" = "$cargo_ver" ] || {
            echo "::error::tag $tag implies $ver but app/Cargo.toml is $cargo_ver, bump it and retag"; exit 1; }

          if [ "$DRY_RUN" != "true" ] && [ "$REHEARSAL" != "true" ]; then
            sha=$(git rev-parse "$tag^{commit}") || { echo "::error::tag $tag does not exist"; exit 1; }
            # Only ship what is on main and went green there.
            git merge-base --is-ancestor "$sha" origin/main \
              || { echo "::error::$tag ($sha) is not on main"; exit 1; }
            # A tag pushed right after the merge waits for main's CI to finish.
            for i in $(seq 1 90); do
              ci=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?check_name=CI%20success" \
                     --jq 'if (.check_runs | length) == 0 then "missing"
                           elif any(.check_runs[]; .status != "completed") then "pending"
                           elif all(.check_runs[]; .conclusion == "success") then "success"
                           else "failure" end')
              case "$ci" in success|failure) break ;; esac
              echo "CI on $sha: $ci, waiting"; sleep 20
            done
            [ "$ci" = "success" ] || { echo "::error::CI on $sha is '$ci', release only a green commit"; exit 1; }
            # Published releases are immutable; a leftover draft is replaced by the draft job.
            if draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null) \
               && [ "$draft" = "false" ]; then
              echo "::error::$tag is already published"; exit 1
            fi
          fi

          prev=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "previous=$prev" >> "$GITHUB_OUTPUT"
          # What the installer tests update FROM: the newest published release
          # that is not this version (a rehearsal of an already-released version
          # would otherwise have nothing to update from).
          from=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases -L 20 \
                   --json tagName --jq '.[].tagName' | grep -vx "v$ver" | head -1 || true)
          echo "update_from=$from" >> "$GITHUB_OUTPUT"
          if [ "$REHEARSAL" = "true" ]; then
            echo "release_tag=$tag-rehearsal.$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing $tag (previous latest: ${prev:-none}; dry run: $DRY_RUN)" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target_key: windows-x86_64
            format: nsis
          # macOS ships per architecture: Apple silicon and Intel.
          - os: macos-15
            target_key: macos-aarch64
            format: app
            arch: arm64
            asset_arch: aarch64
          - os: macos-15-intel
            target_key: macos-x86_64
            format: app
            arch: x86_64
            asset_arch: x86_64
          # Linux ships per architecture too. `ubuntu-24.04-arm` is a standard
          # GitHub-hosted runner (free on public repos), so this is a native
          # build rather than a cross-compile, which matters for a project that
          # links ALSA, D-Bus, OpenSSL and a GPU stack through `-sys` crates.
          - os: ubuntu-22.04
            target_key: linux-x86_64
            format: appimage
            deb_arch: amd64
            rpm_arch: x86_64
          - os: ubuntu-22.04-arm
            target_key: linux-aarch64
            format: appimage
            deb_arch: arm64
            rpm_arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
      CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATER_KEY_PASSWORD }}
      VERSION: ${{ needs.guard.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        working-directory: app # rust-toolchain.toml resolves from CWD
        run: rustup show

      - name: Install cargo-packager
        # PINNED, deliberately. `--locked` only respects cargo-packager's own
        # lockfile; it does NOT fix the version, so without `--version` every
        # release silently installs whatever is newest. This tool decides the
        # .deb's filename and `Package:` field, the NSIS template (including the
        # preinstall hook that removes the pre-rename executable) and which
        # config keys are accepted, all of which our tests assert against a
        # specific version's behaviour. Bump it deliberately:
        # `the_pinned_packager_version_matches_what_the_tests_assume` fails until
        # the test's expectations are revisited too.
        run: cargo install cargo-packager --version 0.11.8 --locked

      # `pkg-config` + `libssl-dev` are BUILD deps (reqwest -> native-tls ->
      # openssl-sys), not packaging ones; they happen to be preinstalled on
      # ubuntu-latest, so the release built here while a clean Linux box failed.
      # Declared explicitly so this list is the real dependency set rather than
      # the runner image's leftovers, same reasoning as ci.yml's.
      - name: Linux build + packaging dependencies
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04 renamed libfuse2 for the 64-bit time_t transition.
          fuse=libfuse2t64
          [ "$(. /etc/os-release && echo "$VERSION_ID")" != "22.04" ] || fuse=libfuse2
          # Retry so a transient apt-mirror stall (actions/runner-images#14823) self-heals.
          for attempt in 1 2 3 4 5; do
            if sudo apt-get update \
              && sudo apt-get install -y -o Acquire::Retries=3 \
                   pkg-config libssl-dev \
                   libasound2-dev libdbus-1-dev libgtk-3-dev libxdo-dev librsvg2-dev \
                   libayatana-appindicator3-dev "$fuse"; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed, retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "::error::apt-get failed after 5 attempts"; exit 1

      # cargo-packager only packages a pre-built binary, so build first.
      - name: Build the release binary
        working-directory: app
        run: cargo build --release --locked

      # Strip before any package is built, so the AppImage, the .deb and the
      # .rpm all carry the smaller binary. A full strip (symbols as well as
      # debug info) takes ~23% off the binary and ~30% off the .deb. Done here
      # rather than via `[profile.release]` because it is a Linux packaging
      # decision: macOS keeps its symbols for the signed bundle's crash reports.
      # Idempotent, so it does not matter if a later step strips again.
      - name: Strip the Linux binary
        if: runner.os == 'Linux'
        run: |
          before=$(stat -c%s app/target/release/soul-player)
          strip app/target/release/soul-player
          after=$(stat -c%s app/target/release/soul-player)
          echo "stripped: $before -> $after bytes"

      - name: Package + updater-sign
        working-directory: app
        run: cargo packager --release -f ${{ matrix.format }}

      # The promise is glibc 2.35 (Ubuntu 22.04, Debian 12; install.sh refuses
      # anything older). Linux therefore BUILDS on Ubuntu 22.04: the AppImage
      # carries copies of the build host's libraries (libdbus, libcrypto,
      # libsystemd, ...), and those copies need whatever glibc the host had. Built
      # on 24.04, 0.4.7's AppImage needed 2.38 and did not start on Ubuntu 22.04
      # or Debian 12, which the installer test caught after the fact.
      #
      # So the gate is every ELF the AppImage ships, not only the main binary.
      #
      # History: v0.2.0 and v0.3.0 were built against 2.43 (libm float symbols)
      # and start on nothing older; the e2e's "previous release runs here" leg
      # reports old releases as a warning, since a published artifact cannot be
      # fixed retroactively.
      - name: glibc floor (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          floor=GLIBC_2.35
          appimage=$(find app/target -maxdepth 3 -name '*.AppImage' | head -1)
          [ -n "$appimage" ] || { echo "::error::no AppImage built"; exit 1; }
          x="$RUNNER_TEMP/appimage-x"
          rm -rf "$x" && mkdir -p "$x"
          (cd "$x" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)
          worst=$floor
          while IFS= read -r f; do
            file -b "$f" | grep -q '^ELF' || continue
            need=$(objdump -T "$f" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 || true)
            [ -n "$need" ] || continue
            if [ "$(printf '%s\n%s\n' "$need" "$floor" | sort -V | tail -1)" != "$floor" ]; then
              echo "::error::${f#"$x"/} needs $need, above the $floor floor"
              worst=$need
            fi
          done < <(find "$x/squashfs-root" -type f)
          echo "binary: $(objdump -T app/target/release/soul-player | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          [ "$worst" = "$floor" ] || exit 1
          echo "ok: nothing in the AppImage needs more than $floor"

      # Stage under a GitHub-safe name (so the manifest URL matches the uploaded asset)
      # and write the updater sidecar for latest.json.
      - name: Stage artifact + write updater sidecar
        run: |
          python .github/scripts/write-meta.py \
            --out-dir app/target/release \
            --target-key ${{ matrix.target_key }} \
            --format ${{ matrix.format }} \
            --stage-dir dist \
            --meta-out dist/${{ matrix.target_key }}.meta.json \
            ${{ runner.os == 'macOS' && format('--asset-name Soul-Player_{0}_{1}.app.tar.gz', needs.guard.outputs.version, matrix.asset_arch) || '' }}
          # Without the updater key the sidecar has no signature and the update can never
          # install, fail here, not after publishing.
          python -c "import json,sys; m=json.load(open('dist/${{ matrix.target_key }}.meta.json')); sys.exit(0 if m['signature'] else 'empty updater signature, is UPDATER_PRIVATE_KEY set?')"

      # Distro-native packages, alongside the AppImage. For a lot of Linux users
      # "not in my package manager" means "not available", so the AppImage alone
      # is not distribution.
      #
      # These are NOT updater artifacts: `latest.json` keeps pointing at the
      # AppImage, because that is the only layout the in-app updater can
      # actually replace. A .deb/.rpm installs to /usr/bin, owned by root, so
      # the app disables self-update there and defers to apt/dnf (see
      # `update::manager_owned`).
      - name: Package .deb + .rpm (Linux)
        if: runner.os == 'Linux'
        run: |
          # Pinned for the same reason as cargo-packager above: it owns the
          # .rpm's name, its SONAME requires and the file list.
          cargo install cargo-generate-rpm --version 0.21.1 --locked
          # The updater key is UNSET for this step, not blanked. cargo-packager
          # signs every package it builds, and a second `.sig` under
          # target/release breaks the staging step, which requires exactly one
          # (the AppImage's, the only artifact the updater verifies). A signed
          # .deb would mean nothing anyway: apt and dnf authenticate through
          # repository signing.
          #
          # `env -u` rather than setting the variable to "": an empty value is
          # still a value, and cargo-packager parses it as a key and dies with
          # "Missing comment in secret key". That is exactly how the first run
          # of this step failed.
          env -u CARGO_PACKAGER_SIGN_PRIVATE_KEY \
              -u CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD \
              packaging/build-linux.sh --skip-build
          cp app/target/release/*.deb dist/
          cp app/target/generate-rpm/*.rpm dist/
          ls -la dist/

      # Building a package is not evidence that it installs, and a dependency
      # list is only right if a package manager agrees. This installs both on
      # the runner, which is the SAME architecture as the build, so the ARM
      # packages get a genuinely native check rather than being shipped on the
      # strength of having compiled.
      #
      # The .deb goes in natively (the runner is Ubuntu); the .rpm goes into a
      # Fedora container, which inherits the host architecture.
      - name: Install-check the .deb and .rpm (Linux)
        if: runner.os == 'Linux'
        # For `gh release download` in the upgrade group below.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::.deb installs and runs"
          sudo apt-get install -y -o Acquire::Retries=3 ./dist/*.deb
          command -v soul-player >/dev/null \
            || { echo "::error::soul-player is not on PATH after installing the .deb"; exit 1; }
          # `ldd` naming an unresolved library is the failure a dependency list
          # exists to prevent, and it is silent until the app is launched.
          #
          # `=> not found`, not a bare `not found`: ldd uses that arrow only for
          # a SONAME it could not resolve. The looser pattern also matches
          # "weak version `GLIBC_2.39' not found", which is NOT a missing
          # library, it is the documented weak-symbol fallback
          # (pidfd_spawnp/pidfd_getpid), and the binary runs without them. That
          # line is absent on this runner (glibc 2.39) and present on anything
          # older, so the loose pattern passes here while being wrong: on
          # Debian 12 the published package reports it and still runs. Verified
          # by installing v0.4.4 there, 0 missing libraries, 1 weak notice.
          missing=$(ldd "$(command -v soul-player)" | grep -c "=> not found" || true)
          [ "$missing" = "0" ] \
            || { echo "::error::$missing libraries unresolved after install"; \
                 ldd "$(command -v soul-player)" | grep "=> not found"; exit 1; }
          soul-player --help >/dev/null 2>&1 \
            || { echo "::error::the installed binary does not run"; exit 1; }
          echo "ok: .deb installs, resolves every library, and runs"
          echo "::endgroup::"

          # Uninstall (Settings → About → Uninstall / --uninstall) on a
          # package-managed install: the app removes its data and says which
          # command removes the package; apt then leaves nothing behind.
          echo "::group::.deb uninstall leaves nothing"
          seed() {
            mkdir -p ~/.config/soul-player ~/.cache/soul-player/now-playing ~/.local/state/soul-player/logs
            echo 'update_auto_check = false' > ~/.config/soul-player/config.toml
            echo log > ~/.local/state/soul-player/logs/Soul.log
            echo art > ~/.cache/soul-player/now-playing/1.png
          }
          seed
          out=$(soul-player --uninstall)
          echo "$out"
          for d in ~/.config/soul-player ~/.cache/soul-player ~/.local/state/soul-player; do
            [ ! -e "$d" ] || { echo "::error::--uninstall left $d"; exit 1; }
          done
          grep -q "sudo apt remove soul-player" <<<"$out" \
            || { echo "::error::--uninstall didn't name the apt command"; exit 1; }
          sudo apt-get remove -y -qq soul-player
          hash -r # bash remembers where it last found a command
          [ ! -e /usr/bin/soul-player ] && ! command -v soul-player >/dev/null \
            || { echo "::error::binary still installed"; exit 1; }
          ! dpkg -s soul-player >/dev/null 2>&1 || { echo "::error::dpkg still lists soul-player"; exit 1; }
          left=$(ls /usr/share/applications/ | grep -i soul || true)
          [ -z "$left" ] || { echo "::error::desktop entry left: $left"; exit 1; }
          echo "ok: --uninstall removed the data, apt removed the rest"
          echo "::endgroup::"

          # Upgrading from the published release, across the binary rename.
          #
          # The rename changed the .deb's FILENAME but not its identity:
          # `Package:` is the kebab-cased product name, so it has been
          # `soul-player` all along (the published 0.4.2 asset is named
          # soul-player-rune_0.4.2_amd64.deb and carries `Package:
          # soul-player`). So this is a same-package upgrade in which
          # /usr/bin/soul-player-rune becomes /usr/bin/soul-player, and what
          # needs proving is that dpkg drops the path the new version no longer
          # ships rather than leaving two binaries and two desktop entries.
          #
          # An earlier version of this gate asserted the OLD PACKAGE NAME was
          # installed first, which was never true and failed here, that failure
          # is what established the above.
          echo "::group::upgrade from the published release, across the rename"
          old=$(mktemp -d)
          prev="${{ needs.guard.outputs.previous }}"
          if [ -n "$prev" ] && gh release download "$prev" --dir "$old" \
               --pattern "*_${{ matrix.deb_arch }}.deb" 2>/dev/null; then
            echo "upgrading from $prev"
            sudo apt-get install -y -o Acquire::Retries=3 "$old"/*.deb
            # Identify by the path it installs, not by a package name: the point
            # is which binary is on disk before and after.
            old_bin=$(dpkg -L soul-player | grep -E "^/usr/bin/" | head -1)
            echo "  $prev installs $old_bin"

            # `dpkg -i`, not `apt-get install`: whenever the built version
            # equals the published one, every dry run between a release and
            # the next version bump, apt answers "already the newest version"
            # and does nothing, so the upgrade silently never happens. dpkg
            # unpacks over regardless of version, which is what exercises the
            # file move, and behaves identically when the version is higher.
            # Dependencies are already satisfied by the install above, so dpkg's
            # lack of resolution costs nothing here.
            #
            # This is not a workaround for a test artefact: the assertion below
            # CAUGHT the no-op (it reported the old binary path still installed
            # after the "upgrade"), which is exactly what it is for.
            sudo dpkg -i ./dist/*.deb

            new_bin=$(dpkg -L soul-player | grep -E "^/usr/bin/" | head -1)
            echo "  this build installs $new_bin"
            [ "$new_bin" = "/usr/bin/soul-player" ] \
              || { echo "::error::expected /usr/bin/soul-player, got $new_bin"; exit 1; }

            # The actual risk: the previous version's binary left behind.
            if [ "$old_bin" != "$new_bin" ] && [ -e "$old_bin" ]; then
              echo "::error::$old_bin survived the upgrade, two binaries installed"
              ls -la /usr/bin/soul-player* || true
              exit 1
            fi
            bins=$(ls /usr/bin/soul-player* 2>/dev/null | wc -l)
            [ "$bins" = "1" ] \
              || { echo "::error::expected 1 binary in /usr/bin, found $bins"; \
                   ls -la /usr/bin/soul-player*; exit 1; }
            entries=$(ls /usr/share/applications/ | grep -c "soul-player" || true)
            [ "$entries" = "1" ] \
              || { echo "::error::expected 1 desktop entry, found $entries"; \
                   ls /usr/share/applications/ | grep soul-player; exit 1; }
            soul-player --help >/dev/null 2>&1 \
              || { echo "::error::the upgraded binary does not run"; exit 1; }
            sudo apt-get remove -y -qq soul-player
            echo "ok: $prev -> this build upgrades cleanly across the rename"
          else
            echo "::warning::no previous release .deb for ${{ matrix.deb_arch }}; upgrade path unverified"
          fi
          echo "::endgroup::"
          echo "::group::.rpm installs and runs (Fedora container, host arch)"
          docker run --rm -v "$PWD/dist:/w:ro" fedora:latest bash -c '
            set -e
            dnf install -y -q /w/*.rpm
            # `=> not found` only, see the .deb check above for why a bare
            # "not found" also catches the harmless weak-symbol notice.
            m=$(ldd /usr/bin/soul-player | grep -c "=> not found" || true)
            [ "$m" = "0" ] || { ldd /usr/bin/soul-player | grep "=> not found"; exit 1; }
            # `--help` writes to stderr, so both streams go to /dev/null;
            # the exit status is what is being checked.
            /usr/bin/soul-player --help >/dev/null 2>&1
            echo "ok: .rpm installs, resolves every library, and runs"
            mkdir -p ~/.config/soul-player ~/.cache/soul-player ~/.local/state/soul-player/logs
            echo x > ~/.config/soul-player/config.toml
            out=$(/usr/bin/soul-player --uninstall)
            echo "$out"
            for d in ~/.config/soul-player ~/.cache/soul-player ~/.local/state/soul-player; do
              [ ! -e "$d" ] || { echo "--uninstall left $d"; exit 1; }
            done
            grep -q "sudo dnf remove soul-player" <<<"$out"
            dnf remove -y -q soul-player
            ! rpm -q soul-player >/dev/null 2>&1
            [ ! -e /usr/bin/soul-player ]
            ! ls /usr/share/applications/ | grep -qi soul
            echo "ok: .rpm uninstall: --uninstall removed the data, dnf removed the rest"
          '
          echo "::endgroup::"

      # The screenshots the AppStream metadata points at. Flathub requires them
      # to be reachable over HTTPS, and `co.soulaudio.soulplayer.metainfo.xml`
      # names them under `releases/latest/download/`, so they have to ship as
      # release assets or software centres show an app with no pictures.
      #
      # Rendered by the app itself (`--snap`, the same offscreen path the UI
      # tests use) against the repo's own fixtures, so they always show the
      # version being released rather than a screenshot someone took once. x86_64
      # only: the two architectures render identically, and uploading both would
      # collide on the asset name.
      - name: Screenshots for the software centres (Linux x86_64)
        if: matrix.target_key == 'linux-x86_64'
        run: |
          # The release job builds the binary but never RUNS it, so it installs
          # no runtime graphics stack. A headless render needs an X server, an
          # xauth cookie for xvfb-run, and a Vulkan ICD, Lavapipe, since a
          # runner has no GPU. wgpu has no GL fallback compiled in, so without
          # an ICD there is no adapter and nothing renders.
          sudo apt-get install -y -o Acquire::Retries=3 \
            xvfb xauth mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0
          shot() {
            # stderr is kept: a failed render otherwise reports only a missing
            # file, which says nothing about why.
            xvfb-run -a -s "-screen 0 1600x1000x24" \
              env SOUL_PLAYER_FOLDER=testdata SOUL_PLAYER_NO_UPDATE=1 \
              app/target/release/soul-player \
                --snap "dist/screenshot-$1.png" --size 1400x900 ${2:+--scene "$2"} \
              >"$RUNNER_TEMP/shot-$1.log" 2>&1 || true
          }
          shot library
          shot albums albums
          shot settings settings-music
          # A zero-byte or missing file would publish a broken image, so check
          # rather than trust the exit status of a GPU render under Xvfb.
          for f in library albums settings; do
            if [ ! -s "dist/screenshot-$f.png" ]; then
              echo "::error::screenshot-$f.png was not rendered"
              echo "--- render output ---"
              cat "$RUNNER_TEMP/shot-$f.log" 2>/dev/null | tail -30 || echo "(none)"
              echo "--- vulkan ICDs present ---"
              ls /usr/share/vulkan/icd.d/ 2>&1 | head
              exit 1
            fi
          done
          ls -la dist/screenshot-*.png

      # The Flatpak, built from the SAME staged files the .rpm uses, so all four
      # Linux packages agree about the app's identity and icon.
      #
      # It is built and then RUN here rather than only built: a Flatpak that
      # builds, installs and validates can still fail at startup inside the
      # sandbox, and the only way to know is to start it and ask the session bus
      # whether it owns its MPRIS name. That name is the whole reason the app
      # reads `FLATPAK_ID` (Flatpak grants exactly
      # `org.mpris.MediaPlayer2.$FLATPAK_ID` and nothing else), so if it is
      # missing, media keys are silently dead and everything else looks fine.
      - name: Package + verify Flatpak (Linux)
        if: runner.os == 'Linux'
        # NO step timeout here, deliberately. This step's duration is dominated
        # by fetching the freedesktop runtime/SDK and the Flathub linter, which
        # is network-bound and wildly variable: observed at 1m18s, 1m28s, 1m42s
        # and 24m02s, and the 24-minute run SUCCEEDED. A cap tight enough to
        # catch a hang would have killed that working release four minutes from
        # the end, which is worse than the slow run it was meant to catch.
        #
        # If this does start hanging for real, the fix is retries or a cache
        # around the flatpak fetches, not a blanket cap: a timeout cannot tell
        # a stall from a slow mirror, and only one of those is a bug.
        run: |
          # The checks (appstreamcli, flatpak-builder-lint) come from Flathub's
          # org.flatpak.Builder, so they match what Flathub runs whatever the
          # runner's Ubuntu: 22.04's own appstreamcli 0.15 rejects the
          # <developer> tag and vcs-browser URL Flathub requires. The BUILD uses
          # the distro's flatpak-builder: the sandboxed one cannot see the SDK
          # installed into the user installation ("Unable to find sdk").
          sudo apt-get install -y -o Acquire::Retries=3 \
            flatpak flatpak-builder xvfb dbus-x11
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08

          stage=app/target/release/linux-stage
          cp packaging/flatpak/co.soulaudio.soulplayer.yml "$stage/"
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder
          flatpak run --command=appstreamcli org.flatpak.Builder \
            validate --no-net "$stage/co.soulaudio.soulplayer.metainfo.xml"

          # Flathub's OWN linter, which `appstreamcli validate` does not replace:
          # they run different checks. appstreamcli asks "is this valid
          # AppStream"; flatpak-builder-lint asks "would Flathub accept this",
          # missing release information, absent OARS rating, no developer name,
          # a manifest without `command` or `modules`, network access declared
          # during build. Flathub runs the manifest and repo checks on their
          # infrastructure, so anything failing here fails there too, and the
          # cheapest place to learn that is before submitting.
          #
          # It is fatal on purpose. It is also useful before we ever submit: it
          # is the only mechanical check that our packaging matches Flathub's
          # requirements, and a warning nobody reads would not provide that.
          lint() { flatpak run --command=flatpak-builder-lint org.flatpak.Builder "$@"; }
          echo "::group::flatpak-builder-lint appstream"
          lint appstream "$stage/co.soulaudio.soulplayer.metainfo.xml"
          echo "::endgroup::"
          echo "::group::flatpak-builder-lint manifest"
          lint manifest packaging/flatpak/co.soulaudio.soulplayer.yml
          echo "::endgroup::"

          # `--state-dir` is explicit and next to the target: flatpak-builder
          # refuses to run when its state dir and target dir are on different
          # filesystems, and the state dir otherwise defaults to
          # `.flatpak-builder` in the CWD, which is the repo checkout, while
          # the target is under RUNNER_TEMP. Those are not guaranteed to be the
          # same mount.
          ( cd "$stage" && flatpak-builder --user --force-clean --install \
              --state-dir="$RUNNER_TEMP/fp-state" \
              --repo="$RUNNER_TEMP/fp-repo" "$RUNNER_TEMP/fp-build" \
              co.soulaudio.soulplayer.yml )

          # Prove it actually runs sandboxed, and owns the one MPRIS name
          # Flatpak's D-Bus policy allows it.
          mkdir -p "$HOME/Music" && cp testdata/meta.flac "$HOME/Music/"
          dbus-run-session -- bash -c '
            xvfb-run -a -s "-screen 0 1280x800x24" \
              flatpak run --user --socket=x11 \
                --env=SOUL_PLAYER_FOLDER="$HOME/Music" \
                --env=SOUL_PLAYER_NO_UPDATE=1 \
                co.soulaudio.soulplayer >"$RUNNER_TEMP/fp-run.log" 2>&1 &
            for i in $(seq 1 60); do
              n=$(dbus-send --session --dest=org.freedesktop.DBus --print-reply / \
                    org.freedesktop.DBus.ListNames 2>/dev/null \
                  | grep -oE "org\.mpris\.MediaPlayer2\.[A-Za-z0-9_.-]+" | head -1)
              [ -n "$n" ] && { echo "MPRIS: $n"; break; }
              sleep 1
            done
            if [ "$n" != "org.mpris.MediaPlayer2.co.soulaudio.soulplayer" ]; then
              echo "::error::the Flatpak did not own its MPRIS name (saw ${n:-nothing}); the sandbox refused it or the app failed to start"
              # Say WHY, rather than leaving the next person to re-run CI to
              # learn nothing: the app logs to its sandboxed state dir, and a
              # crash before logging shows up as an empty log plus whatever the
              # process wrote to the console.
              echo "--- console ---"; tail -40 "$RUNNER_TEMP/fp-run.log" 2>/dev/null || echo "(none)"
              echo "--- app log ---"
              find "$HOME/.var/app/co.soulaudio.soulplayer" -name "*.log*" -type f 2>/dev/null \
                | head -1 | xargs -r tail -40 || echo "(no log written, died before logging started)"
              echo "--- names on the bus ---"
              dbus-send --session --dest=org.freedesktop.DBus --print-reply / \
                org.freedesktop.DBus.ListNames 2>/dev/null | grep -oE "[a-z][A-Za-z0-9_.-]+" | tail -20
              exit 1
            fi
            # `flatpak kill`, NOT `pkill -f soul-player`: the shell running
            # this very script has that string in its own command line (right
            # here), so pkill matches its parent, SIGTERMs it, and the step
            # fails with 143 having already passed every assertion. That is
            # exactly how the first run of this gate "failed", after printing
            # the MPRIS name it was checking for.
            flatpak kill co.soulaudio.soulplayer || true
          '''

          # Uninstall: the sandboxed app removes its own data (under
          # ~/.var/app/<id>) and names the flatpak command; flatpak removes the rest.
          data="$HOME/.var/app/co.soulaudio.soulplayer"
          find "$data" -maxdepth 2 -type d
          [ -d "$data/config/soul-player" ] || { echo "::error::the sandboxed run wrote no settings"; exit 1; }
          out=$(flatpak run --user --env=SOUL_PLAYER_NO_UPDATE=1 co.soulaudio.soulplayer --uninstall)
          echo "$out"
          for d in config/soul-player cache/soul-player .local/state/soul-player; do
            [ ! -e "$data/$d" ] || { echo "::error::--uninstall left $data/$d"; exit 1; }
          done
          grep -q "flatpak uninstall co.soulaudio.soulplayer" <<<"$out" \
            || { echo "::error::--uninstall didn't name the flatpak command"; exit 1; }

          bundle="dist/Soul-Player_${VERSION}_${{ matrix.rpm_arch }}.flatpak"
          flatpak build-bundle "$RUNNER_TEMP/fp-repo" "$bundle" co.soulaudio.soulplayer
          ls -la dist/

          # Install the SHIPPED BUNDLE and run it.
          #
          # Everything above tests the app as `flatpak-builder --install` left
          # it, which is not the artifact anyone downloads. The bundle is a
          # separate file produced by a separate command, and until now it was
          # uploaded to the release without ever being installed, the only
          # Linux format whose shipped bytes were not install-tested.
          echo "::group::the shipped .flatpak installs and runs"
          flatpak uninstall --user -y co.soulaudio.soulplayer >/dev/null 2>&1 || true
          flatpak install --user -y --noninteractive --bundle "$bundle"
          flatpak info co.soulaudio.soulplayer | sed 's/^/  /'

          # What a user's `flatpak update` can actually do with this app. A
          # bundle is a single file with no repository behind it, so the origin
          # it records is what decides whether updates are possible at all,
          # and the in-app updater is deliberately off under Flatpak
          # (update.rs: `manager_owned`). If this prints no usable remote then
          # the README's "updates via flatpak update" is wrong for the bundle
          # and the honest instruction is to install the next one.
          origin=$(flatpak info --show-origin co.soulaudio.soulplayer 2>/dev/null || echo "<none>")
          echo "  bundle origin: $origin"
          flatpak remotes --user --columns=name,url | sed 's/^/  remote: /'

          # Same nesting as the build-install run above (dbus outside, xvfb
          # inside) because that order is the one proven to work on this runner.
          dbus-run-session -- bash -c '
            xvfb-run -a -s "-screen 0 1280x800x24" \
              flatpak run --user --socket=x11 \
                --env=SOUL_PLAYER_FOLDER="$HOME/Music" \
                --env=SOUL_PLAYER_NO_UPDATE=1 \
                co.soulaudio.soulplayer >"$RUNNER_TEMP/fp-bundle-run.log" 2>&1 &
            for i in $(seq 1 60); do
              n=$(dbus-send --session --dest=org.freedesktop.DBus --print-reply / \
                    org.freedesktop.DBus.ListNames 2>/dev/null \
                  | grep -oE "org\.mpris\.MediaPlayer2\.[A-Za-z0-9_.-]+" | head -1)
              [ -n "$n" ] && break
              sleep 1
            done
            if [ "$n" != "org.mpris.MediaPlayer2.co.soulaudio.soulplayer" ]; then
              echo "::error::the installed bundle did not own its MPRIS name (saw ${n:-nothing})"
              tail -40 "$RUNNER_TEMP/fp-bundle-run.log" || true
              exit 1
            fi
            echo "  the bundle runs and owns $n"
            flatpak kill co.soulaudio.soulplayer || true
          '
          echo "::endgroup::"

          # …and flatpak removes the rest: nothing installed, no data dir.
          flatpak uninstall --user -y --noninteractive --delete-data co.soulaudio.soulplayer
          ! flatpak info --user co.soulaudio.soulplayer >/dev/null 2>&1 \
            || { echo "::error::flatpak still lists co.soulaudio.soulplayer"; exit 1; }
          [ ! -d "$HOME/.var/app/co.soulaudio.soulplayer" ] \
            || { echo "::error::~/.var/app/co.soulaudio.soulplayer left behind"; exit 1; }
          echo "ok: Flatpak uninstall: --uninstall removed the data, flatpak removed the rest"


      # macOS: a drag-to-Applications DMG for first installs (the updater keeps using the
      # .app.tar.gz above). Same binary, no rebuild.
      - name: Package DMG (macOS)
        if: runner.os == 'macOS'
        working-directory: app
        run: |
          rm -f target/release/*.dmg
          # create-dmg mounts a scratch image with hdiutil, which now and then
          # fails on hosted runners ("Mounting disk image..." then nothing): retry.
          for attempt in 1 2 3; do
            cargo packager --release -f dmg && break
            [ "$attempt" = 3 ] && exit 1
            echo "::warning::DMG packaging failed (attempt $attempt), retrying"
            rm -f target/release/*.dmg target/release/rw.*.dmg
            sleep 10
          done
          cp target/release/*.dmg "../dist/Soul-Player_${VERSION}_${{ matrix.asset_arch }}.dmg"

      - name: Static bundle checks (macOS)
        if: runner.os == 'macOS'
        run: |
          .github/scripts/verify-macos-bundle.sh "$VERSION" "${{ matrix.arch }}" \
            "dist/Soul-Player_${VERSION}_${{ matrix.asset_arch }}.dmg" \
            "dist/Soul-Player_${VERSION}_${{ matrix.asset_arch }}.app.tar.gz"

      - name: Checksums
        working-directory: dist
        run: |
          for f in *; do
            case "$f" in *.meta.json|*.sha256) continue ;; esac # incl. the file being written
            python -c "import hashlib,sys; p=sys.argv[1]; print(hashlib.sha256(open(p,'rb').read()).hexdigest()+'  '+p)" "$f"
          done > ${{ matrix.target_key }}.sha256
          cat ${{ matrix.target_key }}.sha256

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: bundle-${{ matrix.target_key }}
          path: dist/*
          if-no-files-found: error

  # One DMG for every Mac. Choosing between "aarch64" and "x86_64" is a choice
  # people get wrong, and an Apple silicon Mac running the Intel build works,
  # just slower, through Rosetta, so nobody notices. The universal DMG is the
  # one the release notes point at; it holds both builds (lipo of the two
  # binaries the build legs made and signed, packaged the same way). The
  # in-app updater still fetches the per-architecture .app.tar.gz, so after the
  # first update the bundle is this Mac's build alone.
  macos-universal:
    needs: [guard, build]
    runs-on: macos-15
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        working-directory: app
        run: rustup show

      - name: Install cargo-packager
        # PINNED, deliberately. `--locked` only respects cargo-packager's own
        # lockfile; it does NOT fix the version, so without `--version` every
        # release silently installs whatever is newest. This tool decides the
        # .deb's filename and `Package:` field, the NSIS template (including the
        # preinstall hook that removes the pre-rename executable) and which
        # config keys are accepted, all of which our tests assert against a
        # specific version's behaviour. Bump it deliberately:
        # `the_pinned_packager_version_matches_what_the_tests_assume` fails until
        # the test's expectations are revisited too.
        run: cargo install cargo-packager --version 0.11.8 --locked

      - uses: actions/download-artifact@v4.3.0
        with:
          name: bundle-macos-aarch64
          path: in/arm64

      - uses: actions/download-artifact@v4.3.0
        with:
          name: bundle-macos-x86_64
          path: in/x86_64

      # The exact binaries the per-arch builds shipped (and their e2e tests),
      # taken from their updater archives rather than rebuilt.
      - name: Universal binary
        run: |
          out=app/target/universal-apple-darwin/release
          mkdir -p "$out"
          for a in arm64 x86_64; do
            mkdir -p "ex/$a"
            tar -xzf in/$a/Soul-Player_${VERSION}_*.app.tar.gz -C "ex/$a"
          done
          lipo -create \
            "ex/arm64/Soul Player.app/Contents/MacOS/soul-player" \
            "ex/x86_64/Soul Player.app/Contents/MacOS/soul-player" \
            -output "$out/soul-player"
          archs=$(lipo -archs "$out/soul-player")
          echo "universal binary: $archs"
          [ "$archs" = "x86_64 arm64" ] || { echo "::error::lipo produced '$archs'"; exit 1; }

      # cargo-packager only packages a pre-built binary, so it bundles and
      # ad-hoc-seals this one exactly as it does the per-arch builds. No
      # updater key: the universal DMG is a first-install download, not an
      # update artifact.
      - name: Package universal DMG
        working-directory: app
        run: |
          for attempt in 1 2 3; do  # hdiutil flakes on hosted runners: retry
            cargo packager --release -f dmg --target universal-apple-darwin && break
            [ "$attempt" = 3 ] && exit 1
            echo "::warning::DMG packaging failed (attempt $attempt), retrying"
            rm -f target/universal-apple-darwin/release/*.dmg target/universal-apple-darwin/release/rw.*.dmg
            sleep 10
          done
          mkdir -p ../dist
          cp target/universal-apple-darwin/release/*.dmg "../dist/Soul-Player_${VERSION}_universal.dmg"

      - name: Static bundle checks
        run: .github/scripts/verify-macos-bundle.sh "$VERSION" universal "dist/Soul-Player_${VERSION}_universal.dmg"

      - name: Checksums
        working-directory: dist
        run: shasum -a 256 *.dmg > macos-universal.sha256 && cat macos-universal.sha256

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: bundle-macos-universal
          path: dist/*
          if-no-files-found: error

  e2e:
    needs: [guard, build, macos-universal]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target_key: windows-x86_64
            installer: "*-setup.exe"
          - os: macos-15
            target_key: macos-aarch64
            installer: "*.dmg"
          - os: macos-15-intel
            target_key: macos-x86_64
            installer: "*.dmg"
          - os: ubuntu-24.04
            target_key: linux-x86_64
            installer: "*.AppImage"
          - os: ubuntu-24.04-arm
            target_key: linux-aarch64
            installer: "*.AppImage"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4.3.0
        with:
          name: bundle-${{ matrix.target_key }}
          path: dist

      # macOS: the universal DMG is installed and updated on both Macs too.
      - uses: actions/download-artifact@v4.3.0
        if: runner.os == 'macOS'
        with:
          name: bundle-macos-universal
          path: dist-universal

      # Apple silicon: the Intel DMG as well, the wrong download, to check
      # that it notices Rosetta and switches itself to the Apple silicon build.
      - uses: actions/download-artifact@v4.3.0
        if: matrix.target_key == 'macos-aarch64'
        with:
          name: bundle-macos-x86_64
          path: dist-intel

      - name: Rosetta (Apple silicon)
        if: matrix.target_key == 'macos-aarch64'
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license || true
          arch -x86_64 /bin/sh -c 'uname -m' || echo "::warning::Rosetta may be unavailable"

      # Rune renders through wgpu: a software Vulkan adapter (Lavapipe) under Xvfb, and
      # FUSE to mount the AppImage the way a user's desktop does.
      - name: Runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          for attempt in 1 2 3 4 5; do
            if sudo apt-get update \
              && sudo apt-get install -y -o Acquire::Retries=3 \
                   xvfb mesa-vulkan-drivers libxkbcommon-x11-0 libfuse2t64 libasound2t64 \
                   libgtk-3-0t64 libayatana-appindicator3-1 libxdo3; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      # The new manifest, for the previous release's updater to read (served locally).
      - name: New latest.json
        run: |
          mkdir -p meta && cp dist/*.meta.json meta/
          python .github/scripts/gen-latest-json.py --meta-dir meta \
            --repo "$GITHUB_REPOSITORY" --tag "${{ needs.guard.outputs.tag }}" --version "$VERSION" \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --out latest.json

      # The auto-update leg re-hosts this build's own signed updater artifact (from its
      # sidecar) and lets the installed app update itself through the real OS mechanism.
      - name: Install → run → auto-update → uninstall; upgrade → rollback
        run: |
          installer=$(ls dist/${{ matrix.installer }})
          args=(.github/scripts/release-e2e.py --installer "$installer" --version "$VERSION"
                --target-key ${{ matrix.target_key }} --manifest latest.json --out e2e-out
                --update-meta dist/${{ matrix.target_key }}.meta.json
                --previous-manifest "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json")
          if [ "$RUNNER_OS" = "macOS" ]; then
            args+=(--universal-installer "$(ls dist-universal/*.dmg)")
          fi
          if [ -d dist-intel ]; then
            args+=(--rosetta-installer "$(ls dist-intel/*.dmg)")
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" python "${args[@]}"
          else
            python "${args[@]}"
          fi

      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: e2e-${{ matrix.target_key }}
          path: e2e-out
          if-no-files-found: ignore

  draft:
    needs: [guard, e2e]
    if: github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write # Sigstore signing identity for the provenance attestations
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.guard.outputs.release_tag }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the release notes walk the commits since the previous tag

      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true

      - name: latest.json + SHA256SUMS
        run: |
          # "What's new" in Settings → Updates: features/fixes since the last release.
          python .github/scripts/release-notes.py --selftest
          notes="$(python .github/scripts/release-notes.py --tag "$TAG")"
          printf '%s\n' "$notes"
          python .github/scripts/gen-latest-json.py --meta-dir dist \
            --repo "$GITHUB_REPOSITORY" --tag "$TAG" --version "$VERSION" \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --notes "$notes" \
            --out dist/latest.json
          cat dist/*.sha256 | grep -v '\.sha256$' | sort -k2 > dist/SHA256SUMS
          rm dist/*.sha256 dist/*.meta.json
          (cd dist && sha256sum -c SHA256SUMS && ls -la)

      # SLSA build provenance for every file the release ships: a Sigstore-signed
      # statement that this repo's release workflow, at this commit, built these
      # exact bytes. Anyone can check a download with
      # `gh attestation verify <file> --repo soulaudio/soul-player-ng`.
      - name: Build provenance attestations
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/*

      # Checked here as well as after publishing, so a rehearsal proves it too.
      - name: Verify the attestations
        run: |
          set -euo pipefail
          for f in dist/*; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" >/dev/null \
              || { echo "::error::no valid provenance for $f"; exit 1; }
            echo "ok: provenance for ${f#dist/}"
          done

      - name: Create the draft release
        run: |
          if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
            echo "replacing a leftover draft for $TAG"
            gh release delete "$TAG" --yes
          fi
          cat > notes.md <<'EOF'
          ## Install

          - **macOS**: download **`Soul-Player_<version>_universal.dmg`**: it runs natively on every Mac, Apple silicon and Intel. Open it and drag Soul Player to Applications (if you open it straight from the disk image, it offers to move itself). The smaller `aarch64` (Apple silicon) and `x86_64` (Intel) DMGs hold one build each; on Apple silicon the Intel one offers to switch itself over. The app isn't notarized by Apple yet, so the first launch is blocked: open **System Settings → Privacy & Security** and click **Open Anyway** (or run `xattr -dr com.apple.quarantine "/Applications/Soul Player.app"`). Later updates install in-app.
          - **Homebrew**: `brew tap soulaudio/tap && brew trust soulaudio/tap && brew install --cask soul-player`. Updates arrive in-app (or with `brew upgrade`).
          - **Windows**: run the setup `.exe`. SmartScreen may say *unknown publisher*: **More info → Run anyway**.
          - **Linux**: `chmod +x` the AppImage and run it.

          Verify a download with `sha256sum -c SHA256SUMS --ignore-missing`, and that this repository's release workflow built it with `gh attestation verify <file> --repo soulaudio/soul-player-ng`.
          EOF
          if [ "$REHEARSAL" = "true" ]; then
            # A draft creates no git tag until it is published, so nothing leaks.
            where=(--target "$GITHUB_SHA")
          else
            where=(--verify-tag)
          fi
          gh release create "$TAG" --draft "${where[@]}" --title "Soul Player $TAG" \
            --notes-file notes.md --generate-notes dist/*

      # The draft must hold exactly the bytes the e2e job tested.
      - name: Verify the uploaded assets
        run: |
          mkdir check
          gh release download "$TAG" --dir check
          diff <(ls dist) <(ls check)
          (cd check && sha256sum -c SHA256SUMS)
          # The manifest's URLs must name exactly the uploaded assets.
          jq -r '.platforms[].url' check/latest.json | while read -r url; do
            case "$url" in "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/"*) ;;
              *) echo "::error::manifest URL $url is not under $TAG"; exit 1 ;; esac
            [ -f "check/${url##*/}" ] || { echo "::error::manifest names ${url##*/}, not uploaded"; exit 1; }
          done
          jq -e --argjson n "$PLATFORMS" '.platforms | length == $n' check/latest.json >/dev/null
          # The installer gate (install-candidate) serves these exact bytes.
          mkdir -p candidate/linux candidate/macos
          cp check/latest.json check/SHA256SUMS candidate/linux/
          cp check/latest.json check/SHA256SUMS candidate/macos/
          cp check/*.deb check/*.rpm check/*.AppImage candidate/linux/
          cp check/*_universal.dmg candidate/macos/

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: release-candidate-linux
          path: candidate/linux
          retention-days: 3
          compression-level: 0

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: release-candidate-macos
          path: candidate/macos
          retention-days: 3
          compression-level: 0

      - name: Delete the rehearsal draft
        if: always() && env.REHEARSAL == 'true'
        run: |
          gh release delete "$TAG" --yes 2>/dev/null && echo "rehearsal draft $TAG deleted" || true
          ! git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$TAG" \
            || { echo "::error::rehearsal left a tag $TAG"; exit 1; }

  # The installer (packaging/install.sh, what player.soulaudio.co serves) run
  # against this exact candidate BEFORE anything is published: on every system
  # it supports, install the previous release, update to this one, uninstall,
  # reinstall, purge. A failure stops the release here and deletes the draft.
  install-candidate:
    needs: [guard, draft]
    if: github.event.inputs.dry_run != 'true'
    uses: ./.github/workflows/installer.yml
    with:
      version: ${{ needs.guard.outputs.version }}
      previous: ${{ needs.guard.outputs.update_from }}
      candidate: true

  publish:
    needs: [guard, draft, install-candidate]
    if: github.event.inputs.rehearsal != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Add required reviewers to this environment (Settings → Environments) to make
    # publishing a manual approval.
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish
        run: |
          gh release edit "${{ needs.guard.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --draft=false --latest
          gh release view "${{ needs.guard.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: [guard, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.guard.outputs.version }}
      TAG: ${{ needs.guard.outputs.tag }}
    steps:
      # What every installed app's updater reads.
      - name: Public update manifest and assets
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases"
          for i in $(seq 1 18); do
            v=$(curl -fsSL "$base/latest/download/latest.json" | jq -r .version) || v=""
            [ "$v" = "$VERSION" ] && break
            echo "latest.json reports '${v}', waiting for $VERSION"; sleep 10
          done
          [ "$v" = "$VERSION" ] || { echo "::error::latest/download/latest.json never served $VERSION"; exit 1; }
          curl -fsSL "$base/latest/download/latest.json" -o latest.json
          curl -fsSL "$base/download/$TAG/SHA256SUMS" -o SHA256SUMS
          jq -e --argjson n "$PLATFORMS" '.platforms | length == $n' latest.json >/dev/null \
            || { echo "::error::latest.json does not cover all $PLATFORMS platforms"; jq . latest.json; exit 1; }
          jq -r '.platforms | to_entries[] | "\(.key) \(.value.url) \(.value.signature | length)"' latest.json |
          while read -r key url siglen; do
            [ "$siglen" -gt 0 ] || { echo "::error::$key has no updater signature"; exit 1; }
            name="${url##*/}"
            curl -fsSL "$url" -o "$name"
            grep -F "  $name" SHA256SUMS | sha256sum -c - || { echo "::error::$key: $name differs from the tested build"; exit 1; }
            gh attestation verify "$name" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" >/dev/null \
              || { echo "::error::$key: $name has no valid build provenance"; exit 1; }
            echo "ok: $key → $name"
          done

  # player.soulaudio.co reads the latest release at build time, so the download
  # page keeps offering the previous version until it is rebuilt. If this fails
  # the run goes red even though the release itself published fine, which is
  # the point: the page is lagging and someone has to re-run it.
  site:
    needs: [guard, verify]
    if: github.event.inputs.dry_run != 'true' && github.event.inputs.rehearsal != 'true'
    uses: ./.github/workflows/site.yml
    secrets: inherit

  # The same lifecycle as install-candidate, now through what users actually
  # run: the installer player.soulaudio.co serves, resolving the latest release
  # by itself from GitHub. Runs after `site`, so it tests this release and not
  # the previous one. A failure rolls the release back (see rollback).
  install-script:
    needs: [guard, site]
    if: github.event.inputs.dry_run != 'true' && github.event.inputs.rehearsal != 'true'
    uses: ./.github/workflows/installer.yml
    with:
      version: ${{ needs.guard.outputs.version }}
      previous: ${{ needs.guard.outputs.update_from }}

  # Homebrew (homebrew.yml): PR the new cask to soulaudio/homebrew-tap, merge only
  # when the tap's cask-ci passes, install from the live tap as a user would, and
  # revert the same way if that fails. A Homebrew failure fails this run but never
  # demotes the release: the release itself was verified, the cask is one channel.
  # After install-script, so a release that gets rolled back never reaches the tap.
  homebrew:
    needs: [guard, verify, install-script]
    if: github.event.inputs.dry_run != 'true' && github.event.inputs.rehearsal != 'true'
    uses: ./.github/workflows/homebrew.yml
    with:
      mode: publish
      version: ${{ needs.guard.outputs.version }}
    secrets: inherit

  # A rehearsal publishes nothing, so it proves the Homebrew path with a drill:
  # publish + roll back the tap's current version on a throwaway branch, through
  # cask-ci, with the real App token.
  homebrew-drill:
    needs: [guard, draft]
    if: github.event.inputs.rehearsal == 'true'
    uses: ./.github/workflows/homebrew.yml
    with:
      mode: drill
    secrets: inherit

  # `site` already published the page for a release that has just been
  # demoted, and the page is built from whatever GitHub calls latest, so
  # rebuilding it now moves it back to the previous release. Without this the
  # download page would keep offering a withdrawn version.
  site-after-rollback:
    needs: [rollback]
    if: always() && needs.rollback.result != 'skipped'
    uses: ./.github/workflows/site.yml
    secrets: inherit

  # Withdraws the release when any gate fails: the draft, publishing, the
  # verification, or the installer before (install-candidate) or after
  # (install-script) publishing. A release whose installer does not install is
  # a broken release.
  rollback:
    needs: [guard, draft, install-candidate, publish, verify, install-script]
    if: >-
      always() && github.event.inputs.dry_run != 'true' && github.event.inputs.rehearsal != 'true' &&
      (needs.draft.result == 'failure' || needs.install-candidate.result == 'failure' ||
       needs.publish.result == 'failure' || needs.verify.result == 'failure' ||
       needs.install-script.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.guard.outputs.tag }}
      PREV: ${{ needs.guard.outputs.previous }}
    steps:
      - name: Withdraw the release
        run: |
          set -euo pipefail
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          case "$state" in
            none)
              echo "No release for $TAG, nothing to roll back." ;;
            true)
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
              echo "Deleted the draft $TAG (tag kept)." | tee -a "$GITHUB_STEP_SUMMARY" ;;
            false)
              # Keep the assets for diagnosis but take it out of `latest`, so in-app
              # updaters (which read latest/download/latest.json) stop offering it.
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false
              if [ -n "$PREV" ] && [ "$PREV" != "$TAG" ]; then
                gh release edit "$PREV" --repo "$GITHUB_REPOSITORY" --latest
              fi
              echo "Demoted $TAG to pre-release; latest is ${PREV:-unset} again." | tee -a "$GITHUB_STEP_SUMMARY" ;;
          esac
          exit 1 # the release failed; keep the run red
