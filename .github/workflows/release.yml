name: Release

# Cut a release by bumping app/rune/Cargo.toml on main and pushing a matching `vX.Y.Z` tag
# (or run it manually with the tag). `dry_run: true` runs build + e2e on every platform
# and publishes nothing — use it on a branch before tagging (see app/rune/PACKAGING.md).
#
#   guard ──► build (4 OS legs) ──► e2e (4 OS legs) ──► draft ──► publish ──► verify
#                                                          └────────┴─────────┴──► rollback (on failure)
#
# guard    the tag matches Cargo.toml, sits on main, and that commit passed CI; the
#          tag isn't already published.
# build    compile, package and updater-sign each platform; static bundle checks (macOS:
#          sealed signature, architecture, identity); upload the installers.
# e2e      on a fresh runner of each OS, with the exact installer that will ship:
#          fresh install → run (renders + playback) → uninstall; then upgrade from the
#          currently published release (which must see this one as an update) → rollback
#          to it → uninstall (.github/scripts/release-e2e.py).
# draft    a DRAFT release with the installers, latest.json and SHA256SUMS; the uploaded
#          bytes are re-downloaded and checked against the tested ones.
# publish  undraft and mark latest — only now do users and in-app updaters see it.
# verify   the public `latest/download/latest.json` serves this version and every
#          platform URL in it downloads the tested bytes.
# rollback anything failing after the draft exists: a draft is deleted; a published
#          release is demoted to pre-release and the previous release made latest again,
#          so updaters stop offering it. The tag is kept.
#
# Installers are updater-signed with UPDATER_PRIVATE_KEY (independent of OS code-signing —
# see app/rune/src/update.rs). Apple/Windows code-signing is deferred: macOS ships with a
# sealed ad-hoc signature.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.4.0) — must match app/rune/Cargo.toml. Empty with dry_run: the manifest version."
        required: false
      dry_run:
        description: "Build + e2e every platform, publish nothing (installers stay as run artifacts)"
        type: boolean
        default: false
      rehearsal:
        description: "Dry run + a real DRAFT release under a throwaway tag (uploaded and verified, then deleted). Never published."
        type: boolean
        default: false

# One release at a time, and never cancel one half-way through publishing.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail everywhere, Windows included

env:
  CARGO_TERM_COLOR: always
  DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
  REHEARSAL: ${{ github.event.inputs.rehearsal == 'true' }}

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      checks: read
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      previous: ${{ steps.v.outputs.previous }}
      # The release the draft job creates: the tag, or a throwaway one for a rehearsal.
      release_tag: ${{ steps.v.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          cargo_ver=$(grep -m1 '^version' app/rune/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            if [ -z "$tag" ]; then
              [ "$DRY_RUN" = "true" ] || [ "$REHEARSAL" = "true" ] \
                || { echo "::error::a tag is required unless dry_run or rehearsal is set"; exit 1; }
              tag="v$cargo_ver"
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          ver="${tag#v}"
          # The installer names and the running app's version come from Cargo.toml, the
          # manifest version from the tag — a mismatch ships an update that never applies.
          [ "$ver" = "$cargo_ver" ] || {
            echo "::error::tag $tag implies $ver but app/rune/Cargo.toml is $cargo_ver — bump it and retag"; exit 1; }

          if [ "$DRY_RUN" != "true" ] && [ "$REHEARSAL" != "true" ]; then
            sha=$(git rev-parse "$tag^{commit}") || { echo "::error::tag $tag does not exist"; exit 1; }
            # Only ship what is on main and went green there.
            git merge-base --is-ancestor "$sha" origin/main \
              || { echo "::error::$tag ($sha) is not on main"; exit 1; }
            # A tag pushed right after the merge waits for main's CI to finish.
            for i in $(seq 1 90); do
              ci=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?check_name=CI%20success" \
                     --jq 'if (.check_runs | length) == 0 then "missing"
                           elif any(.check_runs[]; .status != "completed") then "pending"
                           elif all(.check_runs[]; .conclusion == "success") then "success"
                           else "failure" end')
              case "$ci" in success|failure) break ;; esac
              echo "CI on $sha: $ci — waiting"; sleep 20
            done
            [ "$ci" = "success" ] || { echo "::error::CI on $sha is '$ci' — release only a green commit"; exit 1; }
            # Published releases are immutable; a leftover draft is replaced by the draft job.
            if draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null) \
               && [ "$draft" = "false" ]; then
              echo "::error::$tag is already published"; exit 1
            fi
          fi

          prev=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "previous=$prev" >> "$GITHUB_OUTPUT"
          if [ "$REHEARSAL" = "true" ]; then
            echo "release_tag=$tag-rehearsal.$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing $tag (previous latest: ${prev:-none}; dry run: $DRY_RUN)" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target_key: windows-x86_64
            format: nsis
          # macOS ships per architecture: Apple silicon and Intel.
          - os: macos-15
            target_key: macos-aarch64
            format: app
            arch: arm64
            asset_arch: aarch64
          - os: macos-15-intel
            target_key: macos-x86_64
            format: app
            arch: x86_64
            asset_arch: x86_64
          - os: ubuntu-24.04
            target_key: linux-x86_64
            format: appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
      CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.UPDATER_KEY_PASSWORD }}
      VERSION: ${{ needs.guard.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        working-directory: app/rune # rust-toolchain.toml resolves from CWD
        run: rustup show

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      # `pkg-config` + `libssl-dev` are BUILD deps (reqwest -> native-tls ->
      # openssl-sys), not packaging ones; they happen to be preinstalled on
      # ubuntu-latest, so the release built here while a clean Linux box failed.
      # Declared explicitly so this list is the real dependency set rather than
      # the runner image's leftovers — same reasoning as ci.yml's.
      - name: Linux build + packaging dependencies
        if: runner.os == 'Linux'
        run: |
          # Retry so a transient apt-mirror stall (actions/runner-images#14823) self-heals.
          for attempt in 1 2 3 4 5; do
            if sudo apt-get update \
              && sudo apt-get install -y -o Acquire::Retries=3 \
                   pkg-config libssl-dev \
                   libasound2-dev libdbus-1-dev libgtk-3-dev libxdo-dev librsvg2-dev \
                   libayatana-appindicator3-dev libfuse2t64; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed, retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "::error::apt-get failed after 5 attempts"; exit 1

      # cargo-packager only packages a pre-built binary, so build first.
      - name: Build the release binary
        working-directory: app/rune
        run: cargo build --release --locked

      # Strip before any package is built, so the AppImage, the .deb and the
      # .rpm all carry the smaller binary. A full strip (symbols as well as
      # debug info) takes ~23% off the binary and ~30% off the .deb. Done here
      # rather than via `[profile.release]` because it is a Linux packaging
      # decision: macOS keeps its symbols for the signed bundle's crash reports.
      # Idempotent, so it does not matter if a later step strips again.
      - name: Strip the Linux binary
        if: runner.os == 'Linux'
        run: |
          before=$(stat -c%s app/rune/target/release/soul-player-rune)
          strip app/rune/target/release/soul-player-rune
          after=$(stat -c%s app/rune/target/release/soul-player-rune)
          echo "stripped: $before -> $after bytes"

      - name: Package + updater-sign
        working-directory: app/rune
        run: cargo packager --release -f ${{ matrix.format }}

      # The AppImage runs on any distro whose glibc is at least the build's. Keep the floor
      # at Ubuntu 24.04 LTS (2.39). BOTH published releases predate this check and are built
      # against 2.43 (new libm float symbols — asinf/acosf/atan2f/…), so neither v0.2.0 nor
      # v0.3.0 starts on 24.04: `libm.so.6: version 'GLIBC_2.43' not found`. That is the
      # whole reason this gate exists — the e2e's "previous release runs here" leg reports
      # it as a warning rather than a failure, because a published artifact cannot be fixed
      # retroactively and blocking every future release on it would be worse.
      - name: glibc floor (Linux)
        if: runner.os == 'Linux'
        run: |
          need=$(objdump -T app/rune/target/release/soul-player-rune | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "binary needs $need"
          [ "$(printf '%s\nGLIBC_2.39\n' "$need" | sort -V | tail -1)" = "GLIBC_2.39" ] \
            || { echo "::error::binary needs $need, above the GLIBC_2.39 floor (Ubuntu 24.04)"; exit 1; }

      # Stage under a GitHub-safe name (so the manifest URL matches the uploaded asset)
      # and write the updater sidecar for latest.json.
      - name: Stage artifact + write updater sidecar
        run: |
          python .github/scripts/write-meta.py \
            --out-dir app/rune/target/release \
            --target-key ${{ matrix.target_key }} \
            --format ${{ matrix.format }} \
            --stage-dir dist \
            --meta-out dist/${{ matrix.target_key }}.meta.json \
            ${{ runner.os == 'macOS' && format('--asset-name Soul-Player_{0}_{1}.app.tar.gz', needs.guard.outputs.version, matrix.asset_arch) || '' }}
          # Without the updater key the sidecar has no signature and the update can never
          # install — fail here, not after publishing.
          python -c "import json,sys; m=json.load(open('dist/${{ matrix.target_key }}.meta.json')); sys.exit(0 if m['signature'] else 'empty updater signature — is UPDATER_PRIVATE_KEY set?')"

      # Distro-native packages, alongside the AppImage. For a lot of Linux users
      # "not in my package manager" means "not available", so the AppImage alone
      # is not distribution.
      #
      # These are NOT updater artifacts: `latest.json` keeps pointing at the
      # AppImage, because that is the only layout the in-app updater can
      # actually replace. A .deb/.rpm installs to /usr/bin, owned by root, so
      # the app disables self-update there and defers to apt/dnf (see
      # `update::manager_owned`).
      - name: Package .deb + .rpm (Linux)
        if: runner.os == 'Linux'
        env:
          # Deliberately EMPTY: cargo-packager signs every package it builds
          # with this key, and the staging step requires exactly one `.sig`
          # under target/release — the AppImage's, which the updater verifies.
          # A signed .deb would be a second one and break staging, and the
          # signature would mean nothing anyway: apt and dnf authenticate
          # through repository signing, not a per-file updater key.
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ""
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ""
        run: |
          cargo install cargo-generate-rpm --locked
          packaging/build-linux.sh --skip-build
          cp app/rune/target/release/*.deb dist/
          cp app/rune/target/generate-rpm/*.rpm dist/
          ls -la dist/

      # The Flatpak, built from the SAME staged files the .rpm uses, so all four
      # Linux packages agree about the app's identity and icon.
      #
      # It is built and then RUN here rather than only built: a Flatpak that
      # builds, installs and validates can still fail at startup inside the
      # sandbox, and the only way to know is to start it and ask the session bus
      # whether it owns its MPRIS name. That name is the whole reason the app
      # reads `FLATPAK_ID` (Flatpak grants exactly
      # `org.mpris.MediaPlayer2.$FLATPAK_ID` and nothing else), so if it is
      # missing, media keys are silently dead and everything else looks fine.
      - name: Package + verify Flatpak (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -o Acquire::Retries=3 \
            flatpak flatpak-builder appstream xvfb dbus-x11
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08

          stage=app/rune/target/release/linux-stage
          cp packaging/flatpak/co.datadir.soulplayer.yml "$stage/"
          appstreamcli validate --no-net "$stage/co.datadir.soulplayer.metainfo.xml"

          ( cd "$stage" && flatpak-builder --user --force-clean --install \
              --repo="$RUNNER_TEMP/fp-repo" "$RUNNER_TEMP/fp-build" \
              co.datadir.soulplayer.yml )

          # Prove it actually runs sandboxed, and owns the one MPRIS name
          # Flatpak's D-Bus policy allows it.
          mkdir -p "$HOME/Music" && cp testdata/meta.flac "$HOME/Music/"
          dbus-run-session -- bash -c '
            xvfb-run -a -s "-screen 0 1280x800x24" \
              flatpak run --user --socket=x11 \
                --env=SOUL_PLAYER_FOLDER="$HOME/Music" \
                --env=SOUL_PLAYER_NO_UPDATE=1 \
                co.datadir.soulplayer >/dev/null 2>&1 &
            for i in $(seq 1 60); do
              n=$(dbus-send --session --dest=org.freedesktop.DBus --print-reply / \
                    org.freedesktop.DBus.ListNames 2>/dev/null \
                  | grep -oE "org\.mpris\.MediaPlayer2\.[A-Za-z0-9_.-]+" | head -1)
              [ -n "$n" ] && { echo "MPRIS: $n"; break; }
              sleep 1
            done
            if [ "$n" != "org.mpris.MediaPlayer2.co.datadir.soulplayer" ]; then
              echo "::error::the Flatpak did not own its MPRIS name (saw ${n:-nothing}); the sandbox refused it or the app failed to start"
              exit 1
            fi
            pkill -f soul-player-rune || true
          '

          flatpak build-bundle "$RUNNER_TEMP/fp-repo" \
            "dist/Soul-Player_${VERSION}_x86_64.flatpak" co.datadir.soulplayer
          ls -la dist/


      # macOS: a drag-to-Applications DMG for first installs (the updater keeps using the
      # .app.tar.gz above). Same binary, no rebuild.
      - name: Package DMG (macOS)
        if: runner.os == 'macOS'
        working-directory: app/rune
        run: |
          rm -f target/release/*.dmg
          cargo packager --release -f dmg
          cp target/release/*.dmg "../../dist/Soul-Player_${VERSION}_${{ matrix.asset_arch }}.dmg"

      - name: Static bundle checks (macOS)
        if: runner.os == 'macOS'
        run: |
          .github/scripts/verify-macos-bundle.sh "$VERSION" "${{ matrix.arch }}" \
            "dist/Soul-Player_${VERSION}_${{ matrix.asset_arch }}.dmg" \
            "dist/Soul-Player_${VERSION}_${{ matrix.asset_arch }}.app.tar.gz"

      - name: Checksums
        working-directory: dist
        run: |
          for f in *; do
            case "$f" in *.meta.json|*.sha256) continue ;; esac # incl. the file being written
            python -c "import hashlib,sys; p=sys.argv[1]; print(hashlib.sha256(open(p,'rb').read()).hexdigest()+'  '+p)" "$f"
          done > ${{ matrix.target_key }}.sha256
          cat ${{ matrix.target_key }}.sha256

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: bundle-${{ matrix.target_key }}
          path: dist/*
          if-no-files-found: error

  e2e:
    needs: [guard, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target_key: windows-x86_64
            installer: "*-setup.exe"
          - os: macos-15
            target_key: macos-aarch64
            installer: "*.dmg"
          - os: macos-15-intel
            target_key: macos-x86_64
            installer: "*.dmg"
          - os: ubuntu-24.04
            target_key: linux-x86_64
            installer: "*.AppImage"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4.3.0
        with:
          name: bundle-${{ matrix.target_key }}
          path: dist

      # Rune renders through wgpu: a software Vulkan adapter (Lavapipe) under Xvfb, and
      # FUSE to mount the AppImage the way a user's desktop does.
      - name: Runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          for attempt in 1 2 3 4 5; do
            if sudo apt-get update \
              && sudo apt-get install -y -o Acquire::Retries=3 \
                   xvfb mesa-vulkan-drivers libxkbcommon-x11-0 libfuse2t64 libasound2t64 \
                   libgtk-3-0t64 libayatana-appindicator3-1 libxdo3; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      # The new manifest, for the previous release's updater to read (served locally).
      - name: New latest.json
        run: |
          mkdir -p meta && cp dist/*.meta.json meta/
          python .github/scripts/gen-latest-json.py --meta-dir meta \
            --repo "$GITHUB_REPOSITORY" --tag "${{ needs.guard.outputs.tag }}" --version "$VERSION" \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --out latest.json

      # The auto-update leg re-hosts this build's own signed updater artifact (from its
      # sidecar) and lets the installed app update itself through the real OS mechanism.
      - name: Install → run → auto-update → uninstall; upgrade → rollback
        run: |
          installer=$(ls dist/${{ matrix.installer }})
          args=(.github/scripts/release-e2e.py --installer "$installer" --version "$VERSION"
                --target-key ${{ matrix.target_key }} --manifest latest.json --out e2e-out
                --update-meta dist/${{ matrix.target_key }}.meta.json
                --previous-manifest "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json")
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" python "${args[@]}"
          else
            python "${args[@]}"
          fi

      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: e2e-${{ matrix.target_key }}
          path: e2e-out
          if-no-files-found: ignore

  draft:
    needs: [guard, e2e]
    if: github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.guard.outputs.release_tag }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true

      - name: latest.json + SHA256SUMS
        run: |
          python .github/scripts/gen-latest-json.py --meta-dir dist \
            --repo "$GITHUB_REPOSITORY" --tag "$TAG" --version "$VERSION" \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --notes "Soul Player $TAG" \
            --out dist/latest.json
          cat dist/*.sha256 | grep -v '\.sha256$' | sort -k2 > dist/SHA256SUMS
          rm dist/*.sha256 dist/*.meta.json
          (cd dist && sha256sum -c SHA256SUMS && ls -la)

      - name: Create the draft release
        run: |
          if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
            echo "replacing a leftover draft for $TAG"
            gh release delete "$TAG" --yes
          fi
          cat > notes.md <<'EOF'
          ## Install

          - **macOS** — download the DMG for your Mac (`aarch64` = Apple silicon, `x86_64` = Intel) and drag Soul Player to Applications. The app isn't notarized by Apple yet, so the first launch is blocked: open **System Settings → Privacy & Security** and click **Open Anyway** (or run `xattr -dr com.apple.quarantine "/Applications/Soul Player.app"`). Later updates install in-app.
          - **Windows** — run the setup `.exe`. SmartScreen may say *unknown publisher*: **More info → Run anyway**.
          - **Linux** — `chmod +x` the AppImage and run it.

          Verify a download with `sha256sum -c SHA256SUMS --ignore-missing`.
          EOF
          if [ "$REHEARSAL" = "true" ]; then
            # A draft creates no git tag until it is published, so nothing leaks.
            where=(--target "$GITHUB_SHA")
          else
            where=(--verify-tag)
          fi
          gh release create "$TAG" --draft "${where[@]}" --title "Soul Player $TAG" \
            --notes-file notes.md --generate-notes dist/*

      # The draft must hold exactly the bytes the e2e job tested.
      - name: Verify the uploaded assets
        run: |
          mkdir check
          gh release download "$TAG" --dir check
          diff <(ls dist) <(ls check)
          (cd check && sha256sum -c SHA256SUMS)
          # The manifest's URLs must name exactly the uploaded assets.
          jq -r '.platforms[].url' check/latest.json | while read -r url; do
            case "$url" in "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/"*) ;;
              *) echo "::error::manifest URL $url is not under $TAG"; exit 1 ;; esac
            [ -f "check/${url##*/}" ] || { echo "::error::manifest names ${url##*/}, not uploaded"; exit 1; }
          done
          jq -e '.platforms | length == 4' check/latest.json >/dev/null

      - name: Delete the rehearsal draft
        if: always() && env.REHEARSAL == 'true'
        run: |
          gh release delete "$TAG" --yes 2>/dev/null && echo "rehearsal draft $TAG deleted" || true
          ! git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$TAG" \
            || { echo "::error::rehearsal left a tag $TAG"; exit 1; }

  publish:
    needs: [guard, draft]
    if: github.event.inputs.rehearsal != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Add required reviewers to this environment (Settings → Environments) to make
    # publishing a manual approval.
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish
        run: |
          gh release edit "${{ needs.guard.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --draft=false --latest
          gh release view "${{ needs.guard.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"

  verify:
    needs: [guard, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      TAG: ${{ needs.guard.outputs.tag }}
    steps:
      # What every installed app's updater reads.
      - name: Public update manifest and assets
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases"
          for i in $(seq 1 18); do
            v=$(curl -fsSL "$base/latest/download/latest.json" | jq -r .version) || v=""
            [ "$v" = "$VERSION" ] && break
            echo "latest.json reports '${v}', waiting for $VERSION"; sleep 10
          done
          [ "$v" = "$VERSION" ] || { echo "::error::latest/download/latest.json never served $VERSION"; exit 1; }
          curl -fsSL "$base/latest/download/latest.json" -o latest.json
          curl -fsSL "$base/download/$TAG/SHA256SUMS" -o SHA256SUMS
          jq -e '.platforms | length == 4' latest.json >/dev/null \
            || { echo "::error::latest.json does not cover all 4 platforms"; jq . latest.json; exit 1; }
          jq -r '.platforms | to_entries[] | "\(.key) \(.value.url) \(.value.signature | length)"' latest.json |
          while read -r key url siglen; do
            [ "$siglen" -gt 0 ] || { echo "::error::$key has no updater signature"; exit 1; }
            name="${url##*/}"
            curl -fsSL "$url" -o "$name"
            grep -F "  $name" SHA256SUMS | sha256sum -c - || { echo "::error::$key: $name differs from the tested build"; exit 1; }
            echo "ok: $key → $name"
          done

  rollback:
    needs: [guard, draft, publish, verify]
    if: >-
      always() && github.event.inputs.dry_run != 'true' && github.event.inputs.rehearsal != 'true' &&
      (needs.draft.result == 'failure' || needs.publish.result == 'failure' || needs.verify.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.guard.outputs.tag }}
      PREV: ${{ needs.guard.outputs.previous }}
    steps:
      - name: Withdraw the release
        run: |
          set -euo pipefail
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          case "$state" in
            none)
              echo "No release for $TAG — nothing to roll back." ;;
            true)
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
              echo "Deleted the draft $TAG (tag kept)." | tee -a "$GITHUB_STEP_SUMMARY" ;;
            false)
              # Keep the assets for diagnosis but take it out of `latest`, so in-app
              # updaters (which read latest/download/latest.json) stop offering it.
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false
              if [ -n "$PREV" ] && [ "$PREV" != "$TAG" ]; then
                gh release edit "$PREV" --repo "$GITHUB_REPOSITORY" --latest
              fi
              echo "Demoted $TAG to pre-release; latest is ${PREV:-unset} again." | tee -a "$GITHUB_STEP_SUMMARY" ;;
          esac
          exit 1 # the release failed; keep the run red
