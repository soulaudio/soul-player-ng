# Dependabot keeps dependencies and pinned action SHAs current. Grouped,
# weekly updates so the noise is one batched PR per ecosystem, not a flood.
#
# Note: the `soul-audio-core` crates AND the `rune` UI framework are consumed as
# git dependencies pinned to a branch/rev, which Dependabot does not bump (it
# tracks registry/path versions, not git) — those move when we refresh the
# lockfiles deliberately.
version: 2
updates:
  # --- Rust: root (headless `soul-player-backend`) workspace ---
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "rust"]
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  # --- Rust: Rune UI head workspace (separate Cargo.lock) ---
  - package-ecosystem: cargo
    directory: /app/rune
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "rust", "app"]
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  # --- GitHub Actions (keep pinned SHAs fresh) ---
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    groups:
      actions:
        patterns: ["*"]
