[workspace]
resolver = "3"
members = ["crates/soul-player-backend", "crates/soul-server"]
# `alloc-probe` is a standalone leaf crate with its own `[workspace]` (a dev-only
# allocation probe). The backend dev-depends on it by path for the
# `bench_data_pipeline_at_scale` profiling run; since it lives inside this
# workspace's directory, exclude it so cargo treats it as its own root instead of
# sweeping it in as an implicit member.
exclude = ["crates/alloc-probe"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
# Pinned to 0.6 to match soul-audio-core's embedded-io major (the core data layer
# passes `embedded-io` source types across the boundary). A coordinated 0.6 -> 0.7
# bump across core + this app is a separate follow-up.
embedded-io = "0.6"
embedded-io-adapters = "0.6"

[workspace.lints.rust]
# The headless service carries all the logic, keep it provably memory-safe so
# it can be trusted (and, long-term, reused on firmware). No `unsafe` escape.
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
