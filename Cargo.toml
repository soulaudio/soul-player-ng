[workspace]
resolver = "3"
members = ["crates/soul-audio-service"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Pinned to 0.6 to match soul-audio-core's embedded-io major (the core data layer
# passes `embedded-io` source types across the boundary). A coordinated 0.6 -> 0.7
# bump across core + this app is a separate follow-up.
embedded-io = "0.6"
embedded-io-adapters = "0.6"

[workspace.lints.rust]
# The headless service carries all the logic — keep it provably memory-safe so
# it can be trusted (and, long-term, reused on firmware). No `unsafe` escape.
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
