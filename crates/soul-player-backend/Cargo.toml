[package]
name = "soul-player-backend"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Headless desktop-player backend service (actor around soul-audio-control::Player)."


[lints]
workspace = true

[dependencies]
soul-audio-core = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main" }
soul-audio-engine = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main" }
soul-audio-queue = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main", features = ["alloc"] }
soul-audio-control = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main" }
soul-audio-desktop = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main" }
soul-audio-tags = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main", features = ["std"] }
# The shared data layer (new): the scan/model/index the de-fork consumes, now
# that the desktop and the DAP read the one catalog/index built in core.
soul-audio-catalog = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main" }
soul-audio-index = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main", features = ["build"] }
soul-audio-import = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main" }
# Aggregate N watched folders into one browse (the desktop's "library = union of
# sources"); the DAP is the N=1 case and never links this.
soul-audio-multicatalog = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
embedded-io-adapters = { workspace = true, features = ["std"] }

[dev-dependencies]
serde_json = "1"
