[package]
name = "soul-player-backend"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Headless desktop-player backend service (actor around soul-audio-control::Player)."


[lints]
workspace = true

[dependencies]
tracing = "0.1"
# NO `aac` feature: AAC is a Via LA patent; core's policy is that shipped soul products
# (desktop player, DAP) must not enable it. A compile-time guard in lib.rs enforces it.
soul-audio-core = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main" }
soul-audio-engine = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main" }
soul-audio-queue = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main", features = ["alloc"] }
soul-audio-control = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main" }
soul-audio-desktop = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main" }
soul-audio-tags = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main", features = ["std"] }
# Streaming ITU-R BS.1770 / EBU R128 integrated-loudness analyzer (ReplayGain 2.0
# target −18 LUFS). Drives the hybrid path: tracks with NO ReplayGain tags are
# background-analyzed here so a computed gain can stand in for the missing tag.
soul-audio-loudness = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main" }
# The shared data layer (new): the scan/model/index the de-fork consumes, now
# that the desktop and the DAP read the one catalog/index built in core.
soul-audio-catalog = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main" }
soul-audio-index = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main", features = ["build"] }
soul-audio-import = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main", features = ["serde"] }
# Portable no_std playlist model (durable locators + snapshots, editable
# playlists, cover selection), shared with the DAP firmware; `types.rs`
# re-exports its locator/snapshot types so backend/host/app all agree on one
# identity.
soul-audio-playlist = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main", features = ["serde"] }
# Aggregate N watched folders into one browse (the desktop's "library = union of
# sources"); the DAP is the N=1 case and never links this.
soul-audio-multicatalog = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main" }
anyhow = "1"
# "rc" lets the derive serialize the `Arc<str>` interned fields on TrackView
# (artist/album/genre/format). Note: deserialization does NOT re-share Arcs
# (each occurrence allocates), fine here, since interning is an in-process
# materialization concern (views_by), never relied on across a serde roundtrip.
serde = { version = "1", features = ["derive", "rc"] }
embedded-io-adapters = { workspace = true, features = ["std"] }
# Acoustic fingerprinting (Chromaprint, default Algorithm 2) for cloud track
# identity. Pure-Rust (MIT, rubato resampler) so the distributed client stays
# permissive, unlike chromaprint-next's LGPL resampler. See fingerprint.rs.
rusty-chromaprint = "0.3"
# URL-safe base64 for the AcoustID-style compressed-fingerprint wire string.
base64 = "0.22"

[dev-dependencies]
serde_json = "1"
