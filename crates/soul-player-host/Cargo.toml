[package]
name = "soul-player-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Desktop assembly over soul-player-backend: sink selection, folder-open, and the PlayerHandle UI contract every head binds to."

[workspace]
resolver = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
tracing = "0.1"
soul-player-backend = { path = "../soul-player-backend" }
soul-audio-core = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main" }
# Shared no_std streaming loudness analyzer: the DspSink runs its LiveLoudnessMeter on the
# pre-chain signal for the UI's real-time loudness/peak meter.
soul-audio-loudness = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main" }
# Shared no_std parametric-EQ coefficient design (RBJ), reused by the DAP firmware.
soul-audio-eq = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main" }
# Shared no_std DSP-chain + audio-profile model (DspChain/DspUnit/EqUnit/ProfileSet),
# reused by the DAP firmware. The `serde` feature carries the portable profile format
# the desktop persists/exports and the DAP reads.
soul-audio-dsp = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main", features = ["serde"] }
soul-audio-desktop = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main", features = ["playback"] }
# Write-path "managed library" organizer (copy/move into a path-template tree),
# re-exported so a UI head can plan/apply without a direct core git dep.
soul-audio-organize = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main" }
# The `pack`/`unpack` compound-id helpers the remote-source client needs to
# recover a server's OWN track id from an aggregate (local+remote) id — see
# `remote::RemoteLibrary::path_of`. `soul-player-backend` already depends on
# this crate for the same `Library`/`MultiCatalog` plumbing; declaring it here
# too just names the dependency the host code itself calls directly.
soul-audio-multicatalog = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main" }
# Portable no_std playlist model, re-exported so app/rune can import
# `Playlist`/`PlaylistEntry`/`PlaylistCover`/etc. from the host without a
# direct core git dep of its own.
soul-audio-playlist = { git = "https://github.com/soulaudio/soul-audio-core", branch = "main", features = ["serde"] }
anyhow = "1"
# Real-input FFT for the EQ spectrum analyzer (std host only — the no_std core
# never sees it). Wraps rustfft with an r2c API and reused buffers.
realfft = "3"
# Live filesystem watcher (A6): debounced change events over the watched roots →
# a background incremental rescan while the app is open. `-mini` coalesces event
# bursts (an album copy = hundreds of events) into one callback after a quiet
# window. Cross-platform (inotify / FSEvents / ReadDirectoryChangesW).
notify-debouncer-mini = "0.4"
# Read current CPU load so the "Automatic" indexing mode can scale scan
# parallelism to how busy the machine is. Minimal features (system/CPU only).
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
# Blocking HTTP client for the remote-source client: auth, index fetch, and
# track download all happen synchronously on the loader's thread.
reqwest = { version = "0.12", features = ["blocking", "json"] }
# JSON bodies for the remote-source `/v0/auth` request/response (via
# `serde_json::json!`/`Value` — no derive macros needed for two string fields).
serde_json = "1"
# Per-OS cache directory for the remote-source download cache
# (`add_remote_source`'s `DownloadCache`). Same version the app/rune head uses
# for its own config dir.
dirs = "6"
# OS keychain storage for the remote-source OAuth refresh token
# (`remote::KeyringStore`). keyring 3.x ships NO backend by default, so the
# native platform backends must be enabled explicitly: `windows-native`
# (Credential Manager, for local dev + Windows CI), `apple-native` (macOS
# Keychain), and `sync-secret-service` + `crypto-rust` (Linux Secret Service
# using pure-Rust crypto, avoiding an OpenSSL/libsecret C dependency).
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
# Hand-rolled OAuth2.1 Authorization-Code+PKCE client against the remote
# source server's own AS (`remote::login`/`refresh`/`exchange_code`). No
# `openidconnect`/`oauth2` crate: the client only ever carries the access
# token opaquely as a `Bearer` header, so it needs zero JWT-validation
# machinery (and the transitive `rsa` crate, RUSTSEC-2023-0071, that pulls
# in) — just the PKCE verifier/challenge hash and four plain HTTP calls.
sha2 = "0.10"
base64 = "0.22"
# CSPRNG for the PKCE code verifier and the `/authorize` CSRF `state`.
getrandom = "0.2"
# Opens the system browser on the native-app login redirect (RFC 8252).
open = "5"

# On Windows, also pull in the WASAPI exclusive / bit-perfect output backend.
# Cargo unions features across this and the base dependency, so the host builds
# shared-mode `CpalSink` everywhere plus the exclusive sink on Windows. Non-Windows
# targets never see the `wasapi` dependency.
[target.'cfg(windows)'.dependencies.soul-audio-desktop]
git = "https://github.com/soulaudio/soul-audio-core"
branch = "main"
features = ["wasapi-exclusive"]

# On macOS, the CoreAudio exclusive / bit-perfect backend (hog mode + per-track native
# nominal-rate switching + widest physical format). Same feature-union trick as the
# Windows block above; it adds only `coreaudio-rs`, the same 0.11 cpal already links.
[target.'cfg(target_os = "macos")'.dependencies.soul-audio-desktop]
git = "https://github.com/soulaudio/soul-audio-core"
branch = "main"
features = ["coreaudio-exclusive"]

[dev-dependencies]
tempfile = "3"
# The `remote` module's tests drive a REAL in-process soul-server rather than
# faking the HTTP boundary — a dev-only dependency; the shipped player never
# links soul-server (the client speaks its wire protocol over plain HTTP).
soul-server = { path = "../soul-server" }
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
axum = "0.7"
