[package]
name = "soul-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
argon2 = "0.5"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rpassword = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soul-player-backend = { path = "../soul-player-backend" }
thiserror = "2"
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[lib]
path = "src/lib.rs"

[lints]
workspace = true
