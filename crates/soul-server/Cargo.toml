[package]
name = "soul-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.7"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
jsonwebtoken = "9"
rand = "0.8"
ring = "0.17"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
soul-player-backend = { path = "../soul-player-backend" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
toml = "0.8"

[dev-dependencies]
assert_cmd = "2"
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lib]
path = "src/lib.rs"

[lints]
workspace = true
