# Git hooks for the Soul Audio desktop player (Tauri 2 + Svelte over
# soul-audio-service). Requires the lefthook binary.

# Commit-message policy: Conventional Commits + a clean history (no AI /
# attribution trailers). `{1}` is the commit-message file git passes in.
commit-msg:
  commands:
    policy:
      run: sh scripts/commit-msg.sh {1}

# Rust side (the service crate in this repo's workspace). The Tauri app crate is
# an isolated sub-workspace under app/src-tauri with its own checks.
pre-commit:
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check
    clippy:
      glob: "*.rs"
      run: cargo clippy --all-targets -- -D warnings
