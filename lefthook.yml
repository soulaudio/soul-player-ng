# Git hooks for the Soul Audio desktop player (Tauri 2 + Svelte over
# soul-audio-service). Requires the lefthook binary; enable per clone with
# `lefthook install`.

# Commit-message policy: Conventional Commits + a clean history (no AI /
# attribution trailers). `{1}` is the commit-message file git passes in.
commit-msg:
  commands:
    policy:
      run: sh scripts/commit-msg.sh {1}

# Fast pre-commit. Format-check the Rust in BOTH workspaces (the service crate
# in this repo's root workspace and the isolated Tauri app under app/src-tauri)
# and clippy the service crate. The app crate's clippy compiles the whole audio
# stack (the private git dependency), so it's deferred to pre-push / CI.
pre-commit:
  parallel: true
  commands:
    fmt-service:
      glob: "*.{rs,toml}"
      run: cargo fmt --all -- --check
    fmt-app:
      glob: "*.{rs,toml}"
      run: cargo fmt --manifest-path app/src-tauri/Cargo.toml --all -- --check
    clippy-service:
      glob: "*.{rs,toml}"
      run: cargo clippy --all-targets -- -D warnings

# Thorough gate before pushing: service tests, the Svelte type-check, and the
# frontend unit tests. The full app/Tauri build + Playwright e2e run in CI
# (they need the private core crate and a headed webview).
pre-push:
  parallel: true
  commands:
    test-service:
      run: cargo test
    svelte-check:
      run: npm --prefix app run check
    frontend-test:
      run: npm --prefix app run test
