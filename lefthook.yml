# Git hooks for the Soul Audio desktop player (native Rune UI over
# soul-player-backend / soul-player-host). Requires the lefthook binary; enable
# per clone with `lefthook install`.

# Commit-message policy: Conventional Commits + a clean history (no AI /
# attribution trailers). `{1}` is the commit-message file git passes in.
commit-msg:
  commands:
    policy:
      run: sh scripts/commit-msg.sh {1}

# Fast pre-commit: format-check + clippy the root service workspace. The Rune
# head (app/rune) is its own nested workspace on a nightly toolchain and
# compiles the whole GPU stack, so its fmt/clippy/tests run in CI, not here.
pre-commit:
  parallel: true
  commands:
    fmt-service:
      glob: "*.{rs,toml}"
      run: cargo fmt --all -- --check
    clippy-service:
      glob: "*.{rs,toml}"
      run: cargo clippy --all-targets -- -D warnings

# Thorough gate before pushing: service tests. The Rune head build + headless
# tests run in CI (they need the nightly toolchain + a GPU / software Vulkan).
pre-push:
  parallel: true
  commands:
    test-service:
      run: cargo test
