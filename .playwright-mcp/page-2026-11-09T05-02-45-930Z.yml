            - paragraph [ref=f10e229]: This page describes the main panels which go to make up MusicBee's interface (UI) and lists the different components which may be placed within these panels. The links lead to detailed information about each component. In addition there is a high level description of how to customise the layout through the Panels Configuration feature.
