              - link [ref=f10e409] [cursor=pointer]:
                - /url: https://static.wikia.nocookie.net/musicbee/images/3/3f/Configure_Layout_Button.png/revision/latest?cb=20160511140745
                - img "Configure Layout Button" [ref=f10e410]
              - paragraph [ref=f10e412]: Configure Layout Button
            - paragraph [ref=f10e413]:
              - text: The Panels Configuration window is opened with the Configure Layout button, to the left of the
              - link "Search" [ref=f10e414] [cursor=pointer]:
                - /url: /wiki/Search
              - text: box in the
              - link "Tabs Bar" [ref=f10e415] [cursor=pointer]:
                - /url: /wiki/Tabs_Bar
              - text: . It can also be accessed from
              - link "Layout (1)" [ref=f10e416] [cursor=pointer]:
                - /url: /wiki/Layout_(1)
              - text: preferences, with the "Arrange Panels" button.
            - figure [ref=f10e417]:
              - link [ref=f10e418] [cursor=pointer]:
                - /url: https://static.wikia.nocookie.net/musicbee/images/1/1c/Panels_Configuration.png/revision/latest?cb=20160511140703
                - img "Panels Configuration" [ref=f10e419]
                - generic "view image" [ref=f10e422]
              - paragraph [ref=f10e426]: Panels Configuration
            - paragraph [ref=f10e427]: There are 21 elements that can be configured, with 9 possible locations and further configuration options available for most elements. Not every element can be in every location, but many elements can be reordered to your liking, too. That's a LOT of options! Throw in the specific settings for each element and you're unlikely to find two layouts that are exactly the same.
            - paragraph [ref=f10e428]: Let's break it down by location, since that's what you'll see in the Panels Configuration window. The default options are marked. Most elements have further settings that can be configured by using a Panels Settings [...] button.
            - paragraph [ref=f10e429]: Elements with a checkbox to the right may be stacked together (occupying the same layout space) by ticking the box. Any unstacked elements in between ticked elements will cause a new stack to start, or you can use the Panel Splitter element to divide two stacks. Stackable elements are marked here with a +.
            - term [ref=f10e431]:
              - generic [ref=f10e432]: stack
            - figure [ref=f10e433]:
              - link [ref=f10e434] [cursor=pointer]:
                - /url: https://static.wikia.nocookie.net/musicbee/images/2/2c/Tabbed_elements.png/revision/latest?cb=20160511024531
                - img "Stacked Elements with tabs" [ref=f10e435]
              - paragraph [ref=f10e437]: Stacked Elements with tabs
            - list [ref=f10e438]:
              - listitem [ref=f10e439]: "ticked elements are displayed as tabs: example at right"
              - listitem [ref=f10e440]:
                - text: "ticked elements are stacked on top of each other and viewable by clicking a selector button: ("
                - generic [ref=f10e441]: Default
                - text: ) click the top left menu to see a list of elements in the stack, or click in the header bar of the stack to cycle through elements
