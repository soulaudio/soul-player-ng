          - heading "Playback Statistics" [level=3] [ref=f3e908]
          - paragraph [ref=f3e909]: "The foo_playcount component adds a number of fields for playback statistics and ratings. The fields can be used anywhere track info can be displayed. See the documentation for details:"
          - list [ref=f3e910]:
