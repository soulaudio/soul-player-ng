            - paragraph [ref=f15e608]: Fields in this option group allow to define what set of files MusicBee treats as an album. Your files may be placed in different places on your hard disk, organized or not, and be tagged in different ways, but MusicBee still needs to know in some contexts (fe. grouping by album in Album view of the main panel), what files constitute an album.
            - paragraph [ref=f15e609]: "Grouping options allow for flexible album definition: your definition of an album can reflect a physical disk, set of disks sold as one item (multi-disc album, box set) etc."
            - term [ref=f15e611]:
              - generic [ref=f15e612]: files for each album are organized in their own folder
            - paragraph [ref=f15e613]: If you select this radio button, that means that all files in a single folder on your hard disk make up a single album.
            - term [ref=f15e615]:
              - generic [ref=f15e616]: the following fields define an album
            - paragraph [ref=f15e617]:
              - text: (
              - generic [ref=f15e618]: "Default: Album Artist & Album Name"
              - text: ) If you select this radio button, you can define with the following drop-down fields how an album is defined. A set of files is treated as an album, if all these files have identical values for the all the parameters selected in the drop-down fields.
            - paragraph [ref=f15e619]: In the first field you can only select Album Artist (or leave it blank); the value of the second field is fixed to Album Name. In the remaining two fields you can select parameters based on tags (also virtual and custom), file characteristics (fe. bitrate) or MusicBee database field (fe. Play Count).
            - term [ref=f15e621]:
              - generic [ref=f15e622]: detect iTunes compilations and treat as Album Artist
            - paragraph [ref=f15e623]:
              - text: (
              - generic [ref=f15e624]: "Default: unticked, Various Artists"
              - text: ) This field is enabled only when "the following fields define an album" is selected. If this option is selected, MusicBee checks if ITUNES COMPILATION (TCMP) non-standard tag is present in a file and has a value of 1 (you can set this manually in the Settings page of the
              - link "Tag Editor" [ref=f15e625] [cursor=pointer]:
                - /url: /wiki/Tag_Editor
              - text: ). If so, and if there is no Album Artist (TPE2) tag present, MusicBee treats this value as the Album Artist for that file (it is not written into the file, only used internally by MusicBee). See also
              - link "iTunes compilation" [ref=f15e626] [cursor=pointer]:
                - /url: /wiki/ITunes_compilation
              - text: .
