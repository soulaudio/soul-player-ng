      - generic "Foobar2000:Version 2.0 Release Notes" [ref=f4e155]:
        - generic [ref=f4e158]:
          - heading "Version 2.0 overview" [level=1] [ref=f4e160]
          - paragraph [ref=f4e161]: This is a major update introducing new features and functional changes.
          - heading "Requirements" [level=1] [ref=f4e163]
          - list [ref=f4e164]:
            - listitem [ref=f4e165]: Windows 7 or newer.
            - listitem [ref=f4e166]: An x86 (Intel/AMD) processor that is less than 20 years old.
            - listitem [ref=f4e167]:
              - text: "ARM version: see"
              - link "Foobar2000:Foobar2000 for ARM" [ref=f4e168] [cursor=pointer]:
                - /url: /index.php?title=Foobar2000:Foobar2000_for_ARM
          - heading "Notable new features" [level=1] [ref=f4e170]
          - list [ref=f4e171]:
            - listitem [ref=f4e172]: Now available for x86 32-bit (legacy), x86 64-bit and ARM (ARM64EC).
            - listitem [ref=f4e173]: Dark mode support on Windows 10 (1809 or newer) and 11.
            - listitem [ref=f4e174]: Improved performance with large libraries.
            - listitem [ref=f4e175]: Greatly improved performance of all search operations.
            - listitem [ref=f4e176]: Added album art in Default User Interface playlist view.
            - listitem [ref=f4e177]: "New UI element: ReFacets, reimplementing most of Facets functionality."
            - listitem [ref=f4e178]: New audio output device management features - unwanted devices can be disabled, bit depth and DSP can be configured per-device.
            - listitem [ref=f4e179]: "More audio formats supported out of the box: TAK, APE, AC3, DTS."
            - listitem [ref=f4e180]: Added crossfeed DSP from foobar2000 mobile.
          - heading "For Columns UI users" [level=1] [ref=f4e182]
          - paragraph [ref=f4e183]: "Some of Default User Interface elements are now available in Columns UI:"
          - list [ref=f4e184]:
            - listitem [ref=f4e185]: Equalizer
            - listitem [ref=f4e186]: ReFacets
            - listitem [ref=f4e187]: All visualisations
          - heading "Component features that are now available out of the box" [level=1] [ref=f4e189]
          - paragraph [ref=f4e190]: "These add-on components are now obsolete as their functionality is available out of the box:"
          - list [ref=f4e191]:
            - listitem [ref=f4e192]: foo_benchmark
            - listitem [ref=f4e193]: foo_bitcompare
            - listitem [ref=f4e194]: foo_verifier
            - listitem [ref=f4e195]: foo_ac3
            - listitem [ref=f4e196]: foo_sanitizer
            - listitem [ref=f4e197]: foo_input_dts
            - listitem [ref=f4e198]: foo_input_monkey
          - paragraph [ref=f4e199]: "These components previously included with the installer are no longer optional (features always enabled):"
          - list [ref=f4e200]:
            - listitem [ref=f4e201]: foo_rgscan
            - listitem [ref=f4e202]: foo_cdda
            - listitem [ref=f4e203]: foo_albumlist
          - heading "Compatibility with old components" [level=1] [ref=f4e205]
          - list [ref=f4e206]:
            - listitem [ref=f4e207]: "32-bit:"
          - paragraph [ref=f4e208]: Old components mostly work. Decoders should be OK. Some user interface components may suffer from performance issues due to design changes.
          - list [ref=f4e209]:
            - listitem [ref=f4e210]: "64-bit:"
          - paragraph [ref=f4e211]: New builds of components needed.
          - list [ref=f4e212]:
            - listitem [ref=f4e213]: "ARM:"
          - paragraph [ref=f4e214]: Can load x86 64-bit components as well as native ARM components.
          - heading "Full list of changes" [level=1] [ref=f4e216]
          - paragraph [ref=f4e217]:
            - link "Read the change log" [ref=f4e218] [cursor=pointer]:
              - /url: https://www.foobar2000.org/changelog
          - heading "Upgrading from an older version" [level=1] [ref=f4e220]
          - paragraph [ref=f4e221]: Just install the new foobar2000 version without uninstalling.
          - paragraph [ref=f4e222]: With standard installs, there's no need to backup your profile as foobar2000 v2.0 stores its profile data in a separate folder, importing old profile on first run.
          - heading "Before reporting bugs..." [level=1] [ref=f4e224]
          - paragraph [ref=f4e225]: Please verify that any bugs can be recreated WITHOUT ANY COMPONENTS first. ESPECIALLY without any components that have not yet been specifically updated for foobar2000 v2.0.
          - paragraph [ref=f4e226]: Due to design changes, many components will suffer from performance issues until refactored for the new database system.
