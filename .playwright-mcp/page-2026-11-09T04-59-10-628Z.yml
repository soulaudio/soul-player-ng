          - heading "Description" [level=1] [ref=f44e243]
          - paragraph [ref=f44e244]: Displays the database in a tree view using customizable sorting methods (by genre, artist, directory, etc.). Album list panel is based on Album List 3.1.0, by Peter Pawlowski.
          - heading "Link" [level=1] [ref=f44e246]
          - list [ref=f44e247]:
            - listitem [ref=f44e248]:
              - link "Official Website" [ref=f44e249] [cursor=pointer]:
                - /url: https://yuo.be/album-list-panel
          - paragraph [ref=f44e250]
          - heading "Requirements" [level=1] [ref=f44e252]
          - list [ref=f44e253]:
            - listitem [ref=f44e254]:
              - link "foobar2000 1.5" [ref=f44e255] [cursor=pointer]:
                - /url: http://www.foobar2000.org/
            - listitem [ref=f44e256]:
              - link "Columns UI 2.1.0" [ref=f44e257] [cursor=pointer]:
                - /url: https://yuo.be/columns-ui
            - listitem [ref=f44e258]: Windows 7 Service Pack 1 or later
          - paragraph [ref=f44e259]
          - heading "Installation" [level=1] [ref=f44e261]
          - list [ref=f44e262]:
            - listitem [ref=f44e263]: Extract the downloaded archive and place foo_uie_albumlist.dll in your foobar2000 "components" folder (normally located at %ProgramFiles%\foobar2000\components\), or install fb2k.component.
            - listitem [ref=f44e264]: Start foobar2000.
            - listitem [ref=f44e265]: Open up Preferences, navigate to Display -> Columns UI, and select the Layout tab.
            - listitem [ref=f44e266]: Right-click on a splitter and select Insert Panel -> Panels -> Album List
            - listitem [ref=f44e267]: Click Apply to make the panel appear.
          - heading "Context Menu Options" [level=1] [ref=f44e269]
          - heading "Views" [level=2] [ref=f44e271]
          - paragraph [ref=f44e272]: "This is where you pick the different views for the panel. You can add more views (see section: adding views)"
          - heading "Refresh Tree" [level=2] [ref=f44e274]
          - paragraph [ref=f44e275]: "Refreshes the tree. This is useful if: You've updated the media library by moving/deleting files, by updating tags, or if you changed the code of the view you're using."
          - heading "Filter" [level=2] [ref=f44e277]
          - paragraph [ref=f44e278]: Enabling this option puts a small text box at the bottom of the panel which accepts queries (use the autoplaylist help for a guide).
          - heading "Settings" [level=2] [ref=f44e280]
          - paragraph [ref=f44e281]: Allows you to change the behavior of the panel.
          - paragraph [ref=f44e282]
          - heading "Settings" [level=1] [ref=f44e284]
          - paragraph [ref=f44e285]: Album List Panel settings can be accessed either by pressing the Configure button on the Columns UI Layout tab, or by right-clicking the panel itself and selecting Settings. The available settings are split up into two tabs.
          - paragraph [ref=f44e286]: "Note: This section relates to version 0.2.3 beta."
          - heading "Display Tab" [level=2] [ref=f44e288]
          - generic [ref=f44e289]:
            - term [ref=f44e290]: Views
            - definition [ref=f44e291]: This is the lists of "views" available. To change a view while using the panel, Right click the panel, select View -> <choose a view>. To add custom views, see the next section.
          - generic [ref=f44e292]:
            - term [ref=f44e293]: Up/Down buttons
            - definition [ref=f44e294]: Use these to reorder the views list
          - generic [ref=f44e295]:
            - term [ref=f44e296]: Delete/New buttons
            - definition [ref=f44e297]: Use these to remove / create new views
          - generic [ref=f44e298]:
            - term [ref=f44e299]: Double click / Middle Button action
            - definition [ref=f44e300]: "Use this dropdown to configure what happens when you double click / Middle Click an entry in the panel (default: Expand/Collapse, no defaults for middle click)"
          - generic [ref=f44e301]:
            - term [ref=f44e302]: Autosend to playlist
            - definition [ref=f44e303]: use this checkbox to control whether the panel should list contents of the entry when you single click it (e.g. Single clicking on "Metallica" automatically sends all files under Metallica to the playlist)
          - generic [ref=f44e304]:
            - term [ref=f44e305]: Text box below it
            - definition [ref=f44e306]: Type the name of the target playlist (where the panel should display the files)
          - heading "Advanced Tab" [level=2] [ref=f44e308]
          - heading "Appearance" [level=3] [ref=f44e310]
          - generic [ref=f44e311]:
            - term [ref=f44e312]: Show sub-item count
            - definition [ref=f44e313]: Shows the number of items under each entry
          - generic [ref=f44e314]:
            - term [ref=f44e315]: Show horizontal scrollbar
            - definition [ref=f44e316]: (if the content of the entries do not fit the width of the panel)
          - generic [ref=f44e317]:
            - term [ref=f44e318]: Use Item Indices
            - definition [ref=f44e319]: "Displays items in this form: 1. <entry 1> 2. <entry 2 and so on"
          - generic [ref=f44e320]:
            - term [ref=f44e321]: Use Custom vertical padding
            - definition [ref=f44e322]: Change the amount of whitespace between entries
          - generic [ref=f44e323]:
            - term [ref=f44e324]: Use Custom indentation
            - definition [ref=f44e325]: Change the amount of indentation (between an entry and it's parent)
          - generic [ref=f44e326]:
            - term [ref=f44e327]: Window Frame Style
            - definition [ref=f44e328]: Choose between None, Sunken or Gray
          - paragraph [ref=f44e329]
          - heading "Behavior" [level=3] [ref=f44e331]
          - generic [ref=f44e332]:
            - term [ref=f44e333]: Autoplay on send to playlist
            - definition [ref=f44e334]: Choose whether the songs play automatically when added to playlist
          - generic [ref=f44e335]:
            - term [ref=f44e336]: Apply core sort settings on added files
            - definition [ref=f44e337]: If selected, the panel sorts files based on the criteria specified in Preferences-> General -> "Sort incoming files by". When unselected, uses the order as determined by the view.
          - generic [ref=f44e338]:
            - term [ref=f44e339]: Select Added items
            - definition [ref=f44e340]: Choose whether the songs added to the playlist are selected automatically
          - generic [ref=f44e341]:
            - term [ref=f44e342]: Populate on Initialization
            - definition [ref=f44e343]: If unselected, the panel is blank when you start foobar. You need to manually right click the panel and select refresh tree to have it list items. Unchecking this option leads to a decrease in startup time of the program (the effect is very pronounced if you have large libraries)
          - generic [ref=f44e344]:
            - term [ref=f44e345]: Process keyboard shortcuts
            - definition [ref=f44e346]: Allows you to use keyboard shortcuts specified in Preferences-> General -> "Keyboard shortcuts" when the panel has the focus.
          - generic [ref=f44e347]:
            - term [ref=f44e348]: Auto-collapse on Item Expand
            - definition [ref=f44e349]: Automatically closes an entry if you select another one (e.g. if "Metallica" is currently open, and you open "Megadeth", the "metallica" entry collapses)
          - heading "Adding Sources" [level=1] [ref=f44e351]
          - paragraph [ref=f44e352]: The panel uses the pipe key "|" to distinguish between parent and child entries. e.g. If you want to create an entry that goes as Genre -> Artist -> Album, you'd use %genre%|%artist%|%album%.
          - paragraph [ref=f44e353]: "Since the panel supports the full gamut of titleformatting options, you can do some pretty nifty things with it. Examples:"
          - list [ref=f44e354]:
            - listitem [ref=f44e355]: "Decade -> Year -> Artist -> Album:"
          - paragraph [ref=f44e356]: $right(%date%,2)s|%date%|%artist%|%album%
          - list [ref=f44e357]:
            - listitem [ref=f44e358]: "Separate files based on whether they have Replaygain Information:"
          - paragraph [ref=f44e359]: $if(%__replaygain_track_gain%,RG,NO RG)|%album artist%|%album%
          - list [ref=f44e360]:
            - listitem [ref=f44e361]: "Separate files based on the date added to libary (This uses the %added% tag which can be added to files using foo_cwb_hooks):"
          - paragraph [ref=f44e362]: $if(%added%,$left(%added%,4)|$substr(%added%,6,7)|$right(%added%,2)|%album artist%|%album%,No Info ':(')
          - list [ref=f44e363]:
            - listitem [ref=f44e364]: Sort by codec
          - paragraph [ref=f44e365]: "%codec%|%album artist%|%album%"
          - paragraph [ref=f44e366]: "Tip: As far as possible, avoid using code which forces the panel to display a large number of files under a single entry. This reduces memory usage and significantly shortens startup time."
          - heading "External links" [level=1] [ref=f44e368]
