          - paragraph [ref=e190]:
            - text: Album List is a
            - link "Media Library" [ref=e191] [cursor=pointer]:
              - /url: /index.php?title=Foobar2000:Preferences:Media_Library
            - text: viewer that presents Media Library contents in a tree-like view.
          - heading "Views" [level=2] [ref=e193]
          - paragraph [ref=e194]:
            - text: List of views available in your Album List window. Each view's pattern is a
            - link "title formatting" [ref=e195] [cursor=pointer]:
              - /url: /index.php?title=Foobar2000:Title_Formatting
            - text: string defining how the tree structure is built, with parts generating different branch levels separated with | characters.
          - paragraph [ref=e196]: "Some of views use the %<field>% syntax - specific to the Album List component - that allows a single item to be present in more than one branch when the referenced field has more than one value. For an example: a track with two genre values: \"rock\" and \"progressive\" will be placed in a \"rock, progressive\" branch with %genre%, but in both \"rock\" and \"progressive\" branches instead with %<genre>%."
          - paragraph [ref=e197]:
            - text: Album List contains some other
            - link "specific title formatting syntax" [ref=e198] [cursor=pointer]:
              - /url: /index.php?title=Foobar2000:Titleformat_Album_List
            - text: ", not common to title formatting's use in other parts of foobar2000."
          - heading "Actions" [level=2] [ref=e200]
          - paragraph [ref=e201]: This section lets you override certain default tree view behaviors with custom ones.
          - heading "Playlist Interaction" [level=2] [ref=e203]
          - paragraph [ref=e204]: This section lets you customize how Album List's playlist interaction commands work.
          - paragraph [ref=e205]: "See also: right-click menu commands on each Album List item."
