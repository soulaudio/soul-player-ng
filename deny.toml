# cargo-deny policy for the ROOT (headless `soul-player-backend`) workspace.
# Advisory (CVE) scanning is owned by the `cargo audit` job; this gate enforces
# license compliance, dependency-source pinning, and ban rules across the full
# feature graph. The app (Tauri) workspace uses `deny.app.toml` instead.
#
# ARCHITECTURE BOUNDARY (see docs/ARCHITECTURE.md): the service is headless —
# all logic, no visualization. The `[bans]` list below forbids GUI/windowing
# crates so the layer can never become platform-coupled; if a change pulls
# `tauri`/`wry`/`tao` into this workspace, `cargo deny check bans` fails in CI.

[licenses]
version = 2
# Permissive-only allow-list (MIT / Apache / BSD / ISC / Unicode / Zlib family),
# deliberately blocking copyleft. Entries not actually present only warn, so the
# list stays broad enough to cover Tauri, the webview bindings, and cpal's
# per-platform audio backends.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "MPL-2.0",
]
# Skip this workspace's own publish = false crates.
private = { ignore = true }

[bans]
# Duplicate versions are informational (the UI's tree pulls a few), not fatal.
multiple-versions = "warn"
wildcards = "allow"
# The headless service must never pull in a GUI/windowing stack — that belongs
# only in the Rune UI head (app/rune). This is the machine-enforced half of the
# "the UI is just visualization; all logic lives outside it" rule. Mirrors the
# FORBIDDEN list in crates/soul-player-backend/tests/architecture.rs.
deny = [
  { name = "tauri" },
  { name = "wry" },
  { name = "tao" },
  { name = "rune" },
  { name = "wgpu" },
  { name = "winit" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The audio engine is consumed from the sibling library repo as a git dependency.
allow-git = ["https://github.com/soulaudio/soul-audio-core"]
